    document.addEventListener('DOMContentLoaded', () => {

        {
          title: "The Solutions Mindset",
          content: `<h3>From Feature Seller to Problem Solver</h3>
          <p>The best Zetrix employees do not sell avatars—they solve business problems. This mindset shift is the foundation of effective solution architecture and consultation.</p>
          <h3>Seller vs. Solutions Consultant</h3>
          <table style="width:100%;border-collapse:collapse;margin:1em 0;">
            <tr style="background:var(--surface);"><th style="padding:8px;border:1px solid var(--border);">Feature Seller</th><th style="padding:8px;border:1px solid var(--border);">Solutions Consultant</th></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">"Our avatar has voice cloning."</td><td style="padding:8px;border:1px solid var(--border);">"Your support team spends 40% of time on repetitive voice calls. Here's how we eliminate that."</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">"We have 50 integrations."</td><td style="padding:8px;border:1px solid var(--border);">"Your CRM and ticketing system are disconnected, causing 12-minute lookup delays. We connect them."</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">"Our AI is accurate."</td><td style="padding:8px;border:1px solid var(--border);">"You currently resolve 42% of tier-1 inquiries on first contact. We can get you to 75% in 90 days."</td></tr>
          </table>
          <h3>Case Study: The Deal That Almost Died</h3>
          <p>A Zetrix rep pitched an airline on avatar technology by listing features: natural language processing, sentiment analysis, multi-language support. The airline's COO stopped the meeting: "I don't care about features. I care that my call centre costs $18M/year and customers hate waiting 23 minutes."</p>
          <p>The rep pivoted. Instead of features, they presented:</p>
          <ul>
            <li>A cost model: $18M → $7M in year one.</li>
            <li>A wait-time projection: 23 minutes → 45 seconds.</li>
            <li>A pilot plan: 30 days on one route, measurable results.</li>
          </ul>
          <p>The airline signed a $2.4M contract. Lesson: lead with outcomes, not capabilities.</p>
          <h3>Framework: The Value-First Conversation</h3>
          <p>Every client interaction should follow this sequence:</p>
          <ol>
            <li><strong>Diagnose:</strong> What is the business problem? Quantify it.</li>
            <li><strong>Prescribe:</strong> What solution addresses that problem specifically?</li>
            <li><strong>Prove:</strong> How can we demonstrate value before full commitment?</li>
            <li><strong>Partner:</strong> How do we ensure success post-sale?</li>
          </ol>
          <p><strong>Rule:</strong> Never mention a feature until you have identified the problem it solves for this specific client.</p>`,
          quiz: [
            { q: "What should you lead with in a client conversation?", options: ["Product features", "Technical specifications", "Business outcomes", "Company history"], correct: 2 },
            { q: "What was the airline's primary pain point?", options: ["Lack of AI features", "High call centre cost and long wait times", "Need for more staff", "Outdated software"], correct: 1 },
            { q: "What is the first step in the Value-First Conversation?", options: ["Prescribe", "Diagnose", "Prove", "Partner"], correct: 1 },
            { q: "When should you mention product features?", options: ["Immediately", "After identifying the client's problem", "Only in writing", "Never"], correct: 1 }
          ,
            { q: "What is the first step in solution architecture?", options: ["Write code", "Understand the problem and requirements", "Choose a database", "Design the UI"], correct: 1 }],
          passThreshold: 80
        },
        {
          title: "Discovery & Requirements Gathering",
          content: `<h3>Uncovering What the Client Actually Needs</h3>
          <p>Most clients describe symptoms, not root causes. Your job is to dig deeper—without making the client feel interrogated.</p>
          <h3>The Discovery Canvas</h3>
          <p>Use this framework to structure every discovery call:</p>
          <ol>
            <li><strong>Current State:</strong> How do they handle the problem today? People, process, tools.</li>
            <li><strong>Pain Points:</strong> What hurts most? Cost, speed, quality, scalability?</li>
            <li><strong>Business Impact:</strong> How does this pain affect revenue, risk, or reputation?</li>
            <li><strong>Success Criteria:</strong> What does "fixed" look like? Be specific and measurable.</li>
            <li><strong>Constraints:</strong> Budget, timeline, compliance, technical limitations?</li>
            <li><strong>Stakeholders:</strong> Who decides? Who influences? Who will block?</li>
          </ol>
          <h3>Powerful Discovery Questions</h3>
          <ul>
            <li>"What happens if this problem is still unsolved in 12 months?" (Reveals urgency)</li>
            <li>"How do you measure success in this area today?" (Reveals metrics)</li>
            <li>"What have you already tried? Why didn't it work?" (Reveals constraints and scepticism)</li>
            <li>"Who else is affected by this problem?" (Reveals hidden stakeholders)</li>
            <li>"What would a perfect solution look like, regardless of cost?" (Reveals ideal vision)</li>
          </ul>
          <h3>Case Study: The Hidden Stakeholder</h3>
          <p>A retail chain wanted avatars for customer support. Discovery revealed:</p>
          <ul>
            <li>The CMO sponsored the project (budget holder).</li>
            <li>The CTO would implement it (technical gatekeeper).</li>
            <li>The Head of Stores was sceptical (unspoken blocker).</li>
          </ul>
          <p>The Zetrix consultant added a store-manager briefing to the plan, addressing the Head of Stores' concern that avatars would make stores feel "cold." Result: unanimous approval.</p>
          <h3>Framework: The 5-Why Technique</h3>
          <p>When a client states a problem, ask "why" up to 5 times to reach the root cause:</p>
          <ul>
            <li>Problem: "We need faster customer support."</li>
            <li>Why? "Customers complain about wait times."</li>
            <li>Why? "Our agents spend 60% of time looking up information."</li>
            <li>Why? "Knowledge is spread across 4 systems with no search."</li>
            <li>Why? "We never integrated our tools after the merger."</li>
            <li>Why? "IT backlog has been 18 months long."</li>
          </ul>
          <p><strong>Root cause:</strong> Not slow support, but fragmented knowledge and IT capacity constraints. Solution: avatar with unified knowledge retrieval + low-code integration.</p>`,
          interaction: {
            type: 'textarea',
            prompt: 'A prospect says: "We need AI to handle our email overflow." Use the 5-Why Technique to write 5 follow-up questions that uncover the root cause. Then state what the real problem might be.',
            placeholder: 'Why? "How many emails are we talking about?" → Why? "What happens to emails that don\'t get answered?" → ...'
          }
        },
        {
          title: "Solution Design Principles",
          content: `<h3>Building the Right Solution, Not the Maximum Solution</h3>
          <p>The best solution architects resist scope creep. They design elegant systems that solve the core problem without unnecessary complexity.</p>
          <h3>The M.V.S. Framework</h3>
          <p>Minimum Viable Solution — the smallest configuration that delivers measurable value:</p>
          <ol>
            <li><strong>Core Use Case:</strong> One high-impact workflow. Example: "Answer FAQs about order status."</li>
            <li><strong>Essential Knowledge:</strong> Only documents needed for that use case. Resist "ingest everything."</li>
            <li><strong>Single Integration:</strong> One connection to the client's existing stack. Prove value before expanding.</li>
            <li><strong>Clear Metric:</strong> One KPI that proves success. Example: "Reduce FAQ tickets by 50%."</li>
          </ol>
          <h3>Case Study: The Over-Engineered Pilot</h3>
          <p>A logistics company proposed a 6-month pilot with 8 integrations, 3 departments, and custom AI training. Zetrix recommended starting with one integration (their CRM) and one use case (shipment tracking inquiries). The MVS pilot launched in 3 weeks. Results:</p>
          <ul>
            <li>73% of tracking inquiries resolved without human intervention.</li>
            <li>$340K savings in 90 days.</li>
            <li>The success funded phase 2 (3 additional integrations).</li>
          </ul>
          <p>If they had started with the full vision, the pilot would still be in planning.</p>
          <h3>Architecture Decision Records (ADRs)</h3>
          <p>Document every major decision:</p>
          <ul>
            <li><strong>Context:</strong> What problem are we solving?</li>
            <li><strong>Decision:</strong> What did we choose?</li>
            <li><strong>Consequences:</strong> What trade-offs did we accept?</li>
            <li><strong>Alternatives:</strong> What else did we consider?</li>
          </ul>
          <p>ADRs prevent revisiting decisions and help new team members understand why the system is built the way it is.</p>
          <h3>Framework: The Complexity Budget</h3>
          <p>Every solution has a "complexity budget." Spend it wisely:</p>
          <ul>
            <li>Custom integrations: High complexity. Use only when native connectors don't exist.</li>
            <li>Multi-tenancy: Medium complexity. Needed for conglomerates, overkill for single divisions.</li>
            <li>Custom model training: Very high complexity. Rarely justified in phase 1.</li>
            <li>Standard knowledge base + webhooks: Low complexity. Start here.</li>
          </ul>
          <p><strong>Rule:</strong> If a feature does not directly improve the core metric, defer it to phase 2.</p>`,
          assessment: {"type": "matching", "pairs": [{"left": "Monolith", "right": "Single codebase, simple deployment"}, {"left": "Microservices", "right": "Independent deployable services"}, {"left": "Serverless", "right": "Event-driven, no server management"}, {"left": "Event-Driven", "right": "Components communicate via events"}]}
        },
        {
          title: "Technical Scoping",
          content: `<h3>Translating Business Needs into Technical Specifications</h3>
          <p>A well-scoped project prevents scope creep, budget overruns, and disappointed clients. This segment teaches precise technical scoping for avatar deployments.</p>
          <h3>The Scope Document Template</h3>
          <p>Every Zetrix proposal should include:</p>
          <ol>
            <li><strong>Executive Summary:</strong> One paragraph stating the business problem and proposed solution.</li>
            <li><strong>Use Cases:</strong> Numbered list of workflows the avatar will handle. Be specific: "Answer order status inquiries via chat" not "Handle customer service."</li>
            <li><strong>Knowledge Base:</strong> Document types, sources, estimated volume, and refresh frequency.</li>
            <li><strong>Integrations:</strong> Systems to connect, data flow direction, and API requirements.</li>
            <li><strong>User Base:</strong> Number of users, roles, and geographic distribution.</li>
            <li><strong>Deployment Model:</strong> SaaS, VPC, Private Cloud, or On-Premise.</li>
            <li><strong>Success Metrics:</strong> Specific targets with measurement methods.</li>
            <li><strong>Timeline:</strong> Phased milestones, not just a single end date.</li>
            <li><strong>Assumptions & Dependencies:</strong> What must the client provide? API access? Content? Sign-offs?</li>
            <li><strong>Out of Scope:</strong> Explicitly state what is NOT included. This prevents misunderstandings.</li>
          </ol>
          <h3>Case Study: The Scope That Saved a Project</h3>
          <p>A telecom client signed a $1.2M contract for avatar deployment. The initial scope was vague: "Improve customer service with AI." Three months in, the client expected the avatar to handle billing disputes, technical troubleshooting, and sales upsells—none of which were in the original plan.</p>
          <p>Because the Zetrix team had documented explicit use cases and an "Out of Scope" section, they were able to:</p>
          <ul>
            <li>Deliver the original scope on time.</li>
            <li>Negotiate a change order for additional use cases ($400K add-on).</li>
            <li>Maintain client trust by showing transparency.</li>
          </ul>
          <h3>Estimating Effort</h3>
          <p>Use the Zetrix standard effort model:</p>
          <table style="width:100%;border-collapse:collapse;margin:1em 0;">
            <tr style="background:var(--surface);"><th style="padding:8px;border:1px solid var(--border);">Component</th><th style="padding:8px;border:1px solid var(--border);">Low Complexity</th><th style="padding:8px;border:1px solid var(--border);">Medium Complexity</th><th style="padding:8px;border:1px solid var(--border);">High Complexity</th></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Knowledge base setup</td><td style="padding:8px;border:1px solid var(--border);">3 days</td><td style="padding:8px;border:1px solid var(--border);">1 week</td><td style="padding:8px;border:1px solid var(--border);">2–3 weeks</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Native integration</td><td style="padding:8px;border:1px solid var(--border);">2 days</td><td style="padding:8px;border:1px solid var(--border);">1 week</td><td style="padding:8px;border:1px solid var(--border);">2–4 weeks</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Custom integration</td><td style="padding:8px;border:1px solid var(--border);">1 week</td><td style="padding:8px;border:1px solid var(--border);">2–3 weeks</td><td style="padding:8px;border:1px solid var(--border);">1–2 months</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">SSO/SAML setup</td><td style="padding:8px;border:1px solid var(--border);">1 day</td><td style="padding:8px;border:1px solid var(--border);">2–3 days</td><td style="padding:8px;border:1px solid var(--border);">1 week</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">UAT and refinement</td><td style="padding:8px;border:1px solid var(--border);">3 days</td><td style="padding:8px;border:1px solid var(--border);">1 week</td><td style="padding:8px;border:1px solid var(--border);">2 weeks</td></tr>
          </table>
          <h3>Framework: The Assumptions Log</h3>
          <p>Document every assumption. If it changes, the scope changes:</p>
          <ul>
            <li>"Client will provide API documentation within 5 days of kickoff."</li>
            <li>"Content will be provided in machine-readable format (not scanned PDFs)."</li>
            <li>"Client's SSO team is available for configuration within 2 weeks."</li>
            <li>"Legal review will not exceed 10 business days."</li>
          </ul>`,
          interaction: {
            type: 'textarea',
            prompt: 'Write an "Out of Scope" section for a proposal to a university. The project covers student FAQ chatbot for admissions only. The client might expect library help, alumni engagement, and faculty support. Draft 4 bullet points clarifying what is NOT included.',
            placeholder: '• Library resource assistance and catalog search... • Alumni engagement and donation campaigns...'
          }
        },
        {
          title: "Pricing & Packaging",
          content: `<h3>Creating Proposals That Win</h3>
          <p>Pricing is positioning. The way you structure a proposal signals value, partnership, and professionalism.</p>
          <h3>Zetrix Pricing Models</h3>
          <ol>
            <li><strong>Per-User Licensing:</strong> Fixed monthly fee per user seat. Predictable for clients; rewards adoption.</li>
            <li><strong>Usage-Based:</strong> Billed per conversation, token, or API call. Aligns cost with value; good for variable workloads.</li>
            <li><strong>Outcome-Based:</strong> Fees tied to measurable results (e.g., cost per contact reduced by 50%). High risk, high reward.</li>
            <li><strong>Platform Fee + Usage:</strong> Base platform cost + variable usage. Balances predictability and scalability.</li>
          </ol>
          <h3>Good-Better-Best Packaging</h3>
          <p>Structure proposals in three tiers:</p>
          <ul>
            <li><strong>Essential:</strong> Core avatar + 1 integration + standard support. Entry price point.</li>
            <li><strong>Professional:</strong> Multi-avatar + 3 integrations + priority support + analytics dashboard. Most popular.</li>
            <li><strong>Enterprise:</strong> Unlimited avatars + custom integrations + dedicated CSM + SLA guarantees + on-premise option.</li>
          </ul>
          <p>Research shows 60–70% of buyers choose the middle tier when three options are presented.</p>
          <h3>Case Study: The Pricing Conversation</h3>
          <p>A manufacturing client balked at Zetrix's $120K/year quote. Instead of discounting, the consultant reframed:</p>
          <ul>
            <li>Current state: $450K/year on call centre operations.</li>
            <li>Zetrix solution: $120K/year.</li>
            <li>Net savings: $330K/year.</li>
            <li>ROI: 275% in year one.</li>
            <li>Payback period: 3.2 months.</li>
          </ul>
          <p>The client did not ask for a discount. They asked how soon they could start.</p>
          <h3>Framework: The Total Cost of Ownership (TCO) Comparison</h3>
          <p>Help clients see the full picture:</p>
          <table style="width:100%;border-collapse:collapse;margin:1em 0;">
            <tr style="background:var(--surface);"><th style="padding:8px;border:1px solid var(--border);">Cost Category</th><th style="padding:8px;border:1px solid var(--border);">Current State</th><th style="padding:8px;border:1px solid var(--border);">With Zetrix</th></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Labour</td><td style="padding:8px;border:1px solid var(--border);">$450K</td><td style="padding:8px;border:1px solid var(--border);">$180K</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Software licences</td><td style="padding:8px;border:1px solid var(--border);">$45K</td><td style="padding:8px;border:1px solid var(--border);">$120K</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Training & onboarding</td><td style="padding:8px;border:1px solid var(--border);">$20K</td><td style="padding:8px;border:1px solid var(--border);">$15K</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Total</td><td style="padding:8px;border:1px solid var(--border);">$515K</td><td style="padding:8px;border:1px solid var(--border);">$315K</td></tr>
          </table>
          <h3>When to Discount (and When Not To)</h3>
          <ul>
            <li><strong>Discount for:</strong> Multi-year commitments, case study participation, upfront annual payment.</li>
            <li><strong>Never discount for:</strong> "Budget constraints" without trade-offs, vague promises of future business, competitive pressure alone.</li>
          </ul>
          <p><strong>Alternative to discounting:</strong> Add value (extra training, extended pilot, additional integration) rather than reducing price.</p>`,
          quiz: [
            { q: "Which pricing model aligns cost directly with measurable results?", options: ["Per-User Licensing", "Usage-Based", "Outcome-Based", "Platform Fee"], correct: 2 },
            { q: "What percentage of buyers typically choose the middle tier?", options: ["30–40%", "60–70%", "80–90%", "10–20%"], correct: 1 },
            { q: "What is a better alternative to discounting?", options: ["Reducing scope", "Adding value instead of cutting price", "Ignoring the client", "Matching competitor pricing"], correct: 1 },
            { q: "What was the manufacturing client's ROI in year one?", options: ["100%", "175%", "275%", "400%"], correct: 2 }
          ,
            { q: "What should pricing reflect?", options: ["Only competitor prices", "Value delivered and market positioning", "Only internal costs", "Random numbers"], correct: 1 }],
          passThreshold: 80
        },
        {
          title: "Proof of Concept Design",
          content: `<h3>Proving Value Before Full Commitment</h3>
          <p>Enterprise buyers are risk-averse. A well-designed Proof of Concept (PoC) de-risks the decision and accelerates the sales cycle.</p>
          <h3>PoC vs. Pilot vs. Production</h3>
          <table style="width:100%;border-collapse:collapse;margin:1em 0;">
            <tr style="background:var(--surface);"><th style="padding:8px;border:1px solid var(--border);">Phase</th><th style="padding:8px;border:1px solid var(--border);">Duration</th><th style="padding:8px;border:1px solid var(--border);">Scope</th><th style="padding:8px;border:1px solid var(--border);">Goal</th></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">PoC</td><td style="padding:8px;border:1px solid var(--border);">2–4 weeks</td><td style="padding:8px;border:1px solid var(--border);">One use case, synthetic data</td><td style="padding:8px;border:1px solid var(--border);">Prove technical feasibility</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Pilot</td><td style="padding:8px;border:1px solid var(--border);">1–3 months</td><td style="padding:8px;border:1px solid var(--border);">One use case, real data, limited users</td><td style="padding:8px;border:1px solid var(--border);">Prove business value</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Production</td><td style="padding:8px;border:1px solid var(--border);">Ongoing</td><td style="padding:8px;border:1px solid var(--border);">Full scope, all users</td><td style="padding:8px;border:1px solid var(--border);">Scale and optimise</td></tr>
          </table>
          <h3>Designing a Winning PoC</h3>
          <ol>
            <li><strong>Define Success Criteria Upfront:</strong> Both parties must agree on what "success" means before starting. Example: "The avatar correctly answers 80% of test questions from the provided FAQ."</li>
            <li><strong>Use Realistic Data:</strong> Synthetic data proves nothing. Use anonymised real documents or a subset of actual content.</li>
            <li><strong>Limit Scope Ruthlessly:</strong> One use case. One integration (or none). 20 test queries max.</li>
            <li><strong>Set a Hard Deadline:</strong> 2 weeks maximum. Momentum matters. Long PoCs lose executive attention.</li>
            <li><strong>Include the Skeptics:</strong> Invite the most vocal critics to the demo. Converting a sceptic creates an internal champion.</li>
          </ol>
          <h3>Case Study: The 10-Day PoC</h3>
          <p>An insurance company was considering three avatar platforms. Zetrix proposed a 10-day PoC with these terms:</p>
          <ul>
            <li>Scope: Answer 15 common policy questions.</li>
            <li>Data: Client provided 50 pages of policy documents.</li>
            <li>Success: 85%+ accuracy on a blind test of 20 questions.</li>
            <li>Investment: Free. Zetrix absorbed the cost.</li>
          </ul>
          <p>Result: 92% accuracy on day 8. The insurance company's CTO called it "the fastest proof of value I've seen in 20 years." They cancelled evaluations with the other vendors.</p>
          <h3>Framework: The PoC Scorecard</h3>
          <p>Grade every PoC on these dimensions:</p>
          <ul>
            <li><strong>Accuracy:</strong> Did the avatar answer correctly? (Target: 80%+)</li>
            <li><strong>Speed:</strong> Were responses under 3 seconds? (Target: yes)</li>
            <li><strong>Tone:</strong> Did it match the brand voice? (Subjective, but measurable via survey)</li>
            <li><strong>Integration:</strong> Did connected systems work smoothly? (Pass/fail)</li>
            <li><strong>Stakeholder Confidence:</strong> Did decision-makers express readiness to proceed? (Qualitative, but critical)</li>
          </ul>`,
          flashcards: [
            { q: "How long should a PoC last?", a: "2–4 weeks maximum." },
            { q: "What is the primary goal of a PoC?", a: "Prove technical feasibility." },
            { q: "What accuracy target should a PoC aim for?", a: "80% or higher." },
            { q: "Why include sceptics in the PoC demo?", a: "Converting a sceptic creates an internal champion." },
            { q: "What type of data should a PoC use?", a: "Realistic or anonymised real data, not synthetic." }
          ]
        },
