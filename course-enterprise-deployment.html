          content: `<h3>Security Is Non-Negotiable</h3>
          <p>Enterprise clients will not sign a contract until security and compliance questions are answered to their InfoSec team's satisfaction. Every Zetrix employee must speak this language.</p>
          <h3>Core Compliance Frameworks</h3>
          <ol>
            <li><strong>GDPR (EU):</strong> Right to erasure, data portability, consent tracking. Avatars must not retain personal data longer than necessary.</li>
            <li><strong>CCPA/CPRA (California):</strong> Consumer right to know, delete, and opt-out. Similar to GDPR but with different disclosure requirements.</li>
            <li><strong>SOC 2 Type II:</strong> Audited controls for security, availability, and confidentiality. Most SaaS procurement requires this.</li>
            <li><strong>ISO 27001:</strong> International standard for information security management systems.</li>
            <li><strong>HIPAA (US Healthcare):</strong> If handling PHI, avatars need BAAs, encryption at rest/transit, and access logging.</li>
          </ol>

            <li><strong>Incident response:</strong> SLA for breach notification, escalation procedures.</li>

          content: `<h3>Connecting to Enterprise Identity Systems</h3>
          <p>Enterprises do not create standalone accounts. They provision users through their existing identity infrastructure. Zetrix must plug in seamlessly.</p>

            <li>Log in to Zetrix Admin Portal. Navigate to <strong>Settings → Authentication</strong>.</li>

            <li>Download the Zetrix Service Provider metadata XML.</li>
            <li>Upload the metadata to the client's IdP (Identity Provider) admin console.</li>
            <li>Retrieve the client's IdP metadata and upload it to Zetrix.</li>
            <li>Map SAML attributes: email → email, givenName → first_name, surname → last_name, groups → role.</li>
            <li>Enable <strong>Just-In-Time (JIT) provisioning</strong> so users are created on first login.</li>
            <li>Test with a non-production account before enabling for all users.</li>

          content: `<h3>Enterprise Knowledge at Scale</h3>
          <p>Enterprise avatars are only as good as the knowledge they access. Ingesting large, complex document repositories is a core Zetrix capability.</p>
          <h3>Enterprise Document Types</h3>
          <ul>
            <li><strong>Policies & Procedures:</strong> HR handbooks, IT policies, compliance guidelines.</li>
            <li><strong>Product Documentation:</strong> Technical specs, API docs, release notes.</li>

          <ol>
            <li><strong>Discovery:</strong> Work with the client's content team to inventory all source systems (SharePoint, Confluence, file servers, CRM).</li>

          </ol>`,

          <p>Large enterprises often require separate avatar environments per subsidiary, brand, or department. Zetrix multi-tenancy makes this possible without separate infrastructure.</p>

          <ol>
            <li><strong>Single Tenant per Org:</strong> One tenant = one company. Simple but expensive at scale.</li>

        {
          title: "Deployment Patterns",
          content: `<h3>Cloud, On-Premise, and Hybrid</h3>
