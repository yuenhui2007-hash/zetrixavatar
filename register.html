<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
<title>Sign Up — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
<style>
.auth-section { padding: 120px 0 60px; background: #0f172a; min-height: 100vh; }
.auth-container { max-width: 420px; margin: 0 auto; padding: 0 20px; }
.auth-card { background: #1e293b; border-radius: 20px; padding: 40px; }
.auth-card h1 { color: #fff; font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
.auth-subtitle { color: #94a3b8; text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #cbd5e1; font-size: .85rem; font-weight: 500; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px 16px; background: #334155; border: 1px solid #475569; border-radius: 10px; color: #fff; font-size: .95rem; }
.form-group input:focus { outline: none; border-color: #6366f1; }
.btn-block { width: 100%; }
.btn-lg { padding: 14px; font-size: 1rem; }
.auth-error { color: #ef4444; font-size: .85rem; margin-bottom: 12px; display: none; }
.auth-success { color: #10b981; font-size: .85rem; margin-bottom: 12px; display: none; }
.auth-footer { text-align: center; margin-top: 20px; color: #94a3b8; font-size: .9rem; }
.auth-footer a { color: #6366f1; }
.social-login { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; font-weight: 600; border: 1px solid #475569; background: #334155; color: #fff; cursor: pointer; }
.btn-social:hover { background: #475569; }
.btn-apple { background: #fff; color: #1e293b; border-color: #fff; }
.btn-apple:hover { background: #f1f5f9; }
.divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #64748b; font-size: .85rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #475569; }
.demo-note { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 16px; }
.google-btn-wrap { display: flex; justify-content: center; margin-bottom: 10px; }
</style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=5"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<section class="auth-section">
<div class="container auth-container">
<div class="auth-card">
<h1>Create Account</h1>
<p class="auth-subtitle">Join LearnAI — it's free</p>
<div class="demo-note">🔒 Secured server-side authentication.</div>

<!-- Google Sign In With Google button -->
<div class="google-btn-wrap">
  <div id="g_id_onload"
       data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
       data-context="signup"
       data-ux_mode="popup"
       data-callback="handleGoogleCredentialResponse"
       data-auto_prompt="false">
  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-shape="rectangular"
       data-theme="outline"
       data-text="signup_with"
       data-size="large"
       data-logo_alignment="left"
       data-width="320">
  </div>
</div>

<!-- Apple Sign In -->
<button type="button" class="btn btn-social btn-apple" id="appleSignIn" onclick="Auth.loginWithApple()">
  <svg width="18" height="22" viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.3 1.2c.7-.9 1.2-2.1 1-3.2-1.1 0-2.3.7-3.1 1.6-.6.7-1.2 1.9-1 3.1 1.2.1 2.4-.6 3.1-1.5zM17.6 15.3c-.3 1.9-1.4 3.5-2.6 4.7-1.3 1.3-2.8 1.5-3.5 1.5-.7 0-2-.4-3.3-.4s-2.5.4-3.3.4c-1.4.1-2.8-.9-4.1-2.2C.3 17.4-.8 13.8.6 10.3c.7-1.7 2-3 3.5-3.7 1.5-.7 3.2-.7 4-.6.8 0 2.4.5 3.5.4 1-.1 2.6-.5 4.1.4.2.1.3.2.5.3-.7 2-1.8 3.3-1.8 5.2z" fill="#1e293b"/></svg>
  Continue with Apple
</button>

<div class="divider">or</div>
<form id="registerForm">
<div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="John Doe" required></div>
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@gmail.com" required></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required minlength="6"></div>
<div class="auth-error" id="error"></div>
<div class="auth-success" id="success"></div>
<button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
</form>
<div class="auth-footer">
<p>Already have an account? <a href="login.html">Sign In</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
</div>
</section>
<script src="js/theme.js?v=4"></script>
<script src="js/auth.js?v=6"></script>
<script src="js/auth-guard.js?v=2"></script>
<script>
function showError(msg) {
  var el = document.getElementById('error');
  msg = String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  el.textContent = msg;
  el.style.display = 'block';
}
function showSuccess(msg) {
  var el = document.getElementById('success');
  el.textContent = msg;
  el.style.display = 'block';
}

// Google Identity Services callback
function handleGoogleCredentialResponse(response) {
  if (!response || !response.credential) {
    showError('Google sign-in failed. Please try again.');
    return;
  }
  Auth.loginWithGoogle(response.credential).then(function(result) {
    if (result.success) {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect') || 'dashboard.html';
      window.location.href = redirect;
    } else {
      showError(result.error);
    }
  });
}

document.getElementById('registerForm').addEventListener('submit', async function(e) {
e.preventDefault();
var name = document.getElementById('name').value.trim();
var email = document.getElementById('email').value.trim();
var password = document.getElementById('password').value;
if (!name || name.length < 2) { showError('Please enter your full name.'); return; }
if (!email || email.indexOf('@') === -1) { showError('Please enter a valid email address.'); return; }
if (!password || password.length < 6) { showError('Password must be at least 6 characters.'); return; }
var result = await Auth.register(email, password, name);
if (result.success) {
  showSuccess('Account created! Redirecting...');
  setTimeout(function() {
    var params = new URLSearchParams(window.location.search);
    var redirect = params.get('redirect') || 'dashboard.html';
    window.location.href = redirect;
  }, 1000);
}
else { showError(result.error); }
});
</script>
<script src="js/mascot.js?v=4"></script>
<script src="js/pwa.js?v=4"></script>
</body>
</html>
