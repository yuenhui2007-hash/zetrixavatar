<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Completion — One Person Company</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.cert-frame {
  background: #fff;
  border: 3px solid #c41e3a;
  border-radius: 4px;
  padding: 8px;
  max-width: 720px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.cert-inner {
  border: 2px solid #c41e3a;
  border-radius: 2px;
  padding: 48px 56px;
  text-align: center;
}

@media (max-width: 600px) {
  .cert-inner { padding: 32px 24px; }
}

.cert-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 1.3rem;
  color: #ff6b35;
}

.logo-icon {
  width: 36px; height: 36px;
  background: #ff6b35;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}

.badge {
  background: #e11d48;
  color: #fff;
  padding: 8px 20px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.cert-title {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 32px;
}

.cert-label {
  font-size: 1rem;
  color: #64748b;
  margin-bottom: 16px;
}

.name-field {
  font-size: clamp(1.4rem, 3.5vw, 2rem);
  font-weight: 700;
  color: #0f172a;
  border: none;
  outline: none;
  text-align: center;
  width: 100%;
  background: transparent;
  padding: 8px 0;
  font-family: 'Inter', serif;
  cursor: text;
}
.name-field::placeholder {
  color: #94a3b8;
  opacity: 1;
}

.name-line {
  width: 60%;
  height: 3px;
  background: #c41e3a;
  margin: 0 auto 20px;
  border-radius: 2px;
}

.cert-subtitle {
  font-size: 1rem;
  color: #64748b;
  margin-bottom: 16px;
}

.course-name {
  font-size: clamp(1.1rem, 2.5vw, 1.5rem);
  font-weight: 700;
  color: #c41e3a;
  margin-bottom: 12px;
}

.cert-meta {
  font-size: 0.9rem;
  color: #94a3b8;
}

/* Footer */
.cert-footer {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid #e2e8f0;
}

.footer-sig {
  text-align: center;
}
.sig-line {
  width: 140px;
  height: 1px;
  background: #0f172a;
  margin: 0 auto 6px;
}
.sig-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: #0f172a;
}
.sig-title {
  font-size: 0.7rem;
  color: #64748b;
}

.footer-date {
  text-align: center;
}
.date-line {
  font-size: 0.9rem;
  font-weight: 600;
  color: #0f172a;
  margin-bottom: 4px;
}
.date-label {
  font-size: 0.7rem;
  color: #64748b;
}

.seal {
  width: 56px;
  height: 56px;
  background: #e11d48;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.4rem;
}

/* Print styles */
@media print {
  @page { margin: 0; size: auto; }
  body {
    background: #fff;
    padding: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .cert-frame {
    border: 3px solid #c41e3a;
    box-shadow: none;
    max-width: 100%;
    width: 100%;
    margin: 0;
    border-radius: 0;
  }
  .cert-inner {
    padding: 36px 40px;
  }
  .cert-header {
    margin-bottom: 24px;
  }
  .cert-title {
    margin-bottom: 20px;
  }
  .name-line {
    margin-bottom: 14px;
  }
  .cert-footer {
    margin-top: 24px;
    page-break-inside: avoid;
  }
}
</style>
</head>
<body>

<div class="cert-frame">
  <div class="cert-inner">

    <div class="cert-header">
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <span>avatar</span>
      </div>
      <div class="badge">Certified</div>
    </div>

    <h1 class="cert-title">Certificate of Completion</h1>

    <p class="cert-label">This certifies that</p>

    <input type="text" class="name-field" id="nameField" placeholder="Enter Your Name" autocomplete="off" spellcheck="false" autofocus>
    <div class="name-line"></div>

    <p class="cert-subtitle">has successfully completed</p>

    <div class="course-name">One Person Company</div>

    <p class="cert-meta">10 segments · 10 quizzes passed · 100% completion</p>

    <div class="cert-footer">
      <div class="footer-sig">
        <div class="sig-line"></div>
        <div class="sig-name">Zetrix AI</div>
        <div class="sig-title">Founder</div>
      </div>
      <div class="footer-date">
        <div class="date-line" id="dateField">26 August 2026</div>
        <div class="date-label">Date</div>
      </div>
      <div class="seal">🏆</div>
    </div>

  </div>
</div>

<script>
const nameField = document.getElementById('nameField');

// On single click: select all existing text so typing replaces it immediately
nameField.addEventListener('click', function() {
  this.select();
});

// On focus: also select all (for tab navigation)
nameField.addEventListener('focus', function() {
  this.select();
});

// Auto-select on page load so user can type immediately
window.addEventListener('DOMContentLoaded', function() {
  nameField.focus();
  nameField.select();

  // Auto-populate date
  const now = new Date();
  const options = { day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('dateField').textContent = now.toLocaleDateString('en-GB', options);
});
</script>

</body>
</html>
