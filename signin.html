<style>
.signin-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 24px 40px;
  background: linear-gradient(135deg, #000000 0%, #1a1a1a 40%, #0f172a 100%);
}
.signin-card {
  background: var(--card-bg);
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--border-color);
  animation: cardEnter 0.5s ease-out;
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.signin-logo {
  text-align: center;
  margin-bottom: 28px;
}
.signin-logo img {
  height: 40px;
  display: inline-block;
}
.signin-logo h2 {
  font-size: 1.4rem;
  font-weight: 800;
  margin-top: 12px;
  color: var(--dark);
}
.signin-logo p {
  font-size: 0.85rem;
  color: var(--gray);
  margin-top: 4px;
}

.form-group {
  margin-bottom: 16px;
  position: relative;
}
.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--dark);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius);
  background: var(--body-bg);
  color: var(--body-text);
  font-size: 0.95rem;
  transition: var(--transition);
}
.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.1);
}
.form-group input.error {
  border-color: #ef4444;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
}
.form-group .input-hint {
  font-size: 0.75rem;
  color: #ef4444;
  margin-top: 4px;
  display: none;
}
.form-group .input-hint.show { display: block; }

.password-wrap {
  position: relative;
}
.password-wrap input {
  padding-right: 44px;
}
.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: var(--gray);
  font-size: 1.1rem;
  line-height: 1;
}
.toggle-password:hover { color: var(--dark); }

.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 0.8rem;
}
.form-options label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--gray);
  cursor: pointer;
}
.form-options a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}
.form-options a:hover { text-decoration: underline; }

.btn-block {
  width: 100%;
  padding: 13px;
  font-size: 1rem;
  position: relative;
}
.btn-block .spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  position: absolute;
  left: 50%;
  top: 50%;
  margin-left: -9px;
  margin-top: -9px;
}
.btn-block.loading .btn-text { opacity: 0; }
.btn-block.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: var(--gray);
  font-size: 0.78rem;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-color);
}

.social-signin {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 11px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border-color);
  background: var(--body-bg);
  color: var(--body-text);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}
.btn-social:hover {
  background: var(--gray-light);
  transform: translateY(-1px);
}
.btn-social svg {
  width: 18px;
  height: 18px;
}
.btn-social.google { border-color: #4285f4; color: #4285f4; }
.btn-social.google:hover { background: rgba(66,133,244,0.08); }
.btn-social.github { border-color: #333; color: #333; }
.btn-social.github:hover { background: rgba(0,0,0,0.06); }

.signin-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.85rem;
  color: var(--gray);
}
.signin-footer a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
}
.signin-footer a:hover { text-decoration: underline; }

.back-home {
  text-align: center;
  margin-top: 16px;
  font-size: 0.8rem;
}
.back-home a {
  color: var(--gray);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.back-home a:hover { color: var(--primary); }

.error-msg {
  background: rgba(230, 0, 18, 0.08);
  border: 1px solid rgba(230, 0, 18, 0.2);
  color: #B3000E;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
  animation: shake 0.3s ease;
}
.error-msg.show { display: block; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.password-strength {
  height: 3px;
  border-radius: 2px;
  margin-top: 6px;
  background: #e2e8f0;
  overflow: hidden;
  display: none;
}
.password-strength.show { display: block; }
.password-strength .bar {
  height: 100%;
  width: 0;
  transition: width 0.3s, background 0.3s;
  border-radius: 2px;
}

[data-theme="dark"] .signin-page,
.dark .signin-page {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #000000 100%);
}
[data-theme="dark"] .btn-social,
.dark .btn-social {
  background: #1e293b;
  border-color: rgba(255,255,255,0.08);
}
[data-theme="dark"] .btn-social:hover,
.dark .btn-social:hover {
  background: #334155;
}
[data-theme="dark"] .btn-social.github,
.dark .btn-social.github {
  border-color: #94a3b8;
  color: #94a3b8;
}
[data-theme="dark"] .btn-social.github:hover,
.dark .btn-social.github:hover {
  background: rgba(148,163,184,0.1);
}
</style>

<body>

<section class="signin-page">
  <div class="signin-card">
    <div class="signin-logo">
      <a href="index.html"><img src="assets/logo-zetrix-new.png" alt="Zetrix" loading="lazy" decoding="async" decoding="async"></a>
      <h2>Welcome back</h2>
      <p>Sign in to continue your AI journey</p>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="signin-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
        <span class="input-hint" id="email-hint">Please enter a valid email address.</span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">👁</button>
        </div>
        <div class="password-strength" id="strength-bar"><div class="bar" id="strength-bar-inner"></div></div>
        <span class="input-hint" id="password-hint">Password is required.</span>
      </div>
      <div class="form-options">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="support.html">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="divider">or continue with</div>

    <div class="social-signin">
      <button class="btn-social google" id="google-signin" type="button">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>

    <div class="signin-footer">

</main>

<script src="js/theme.js?v=15"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase-config.js?v=15"></script>
  <script src="js/auth.js?v=15"></script>
  <script src="js/progress-sync.js?v=15"></script>
<script>
// Check if already authenticated
(function() {
  if (Auth.getUser()) {
    window.location.href = 'dashboard.html';
  }
})();

const form = document.getElementById('signin-form');
const errorMsg = document.getElementById('error-msg');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const emailHint = document.getElementById('email-hint');
const passwordHint = document.getElementById('password-hint');
const submitBtn = document.getElementById('submit-btn');
const togglePw = document.getElementById('toggle-password');
const strengthBar = document.getElementById('strength-bar');
const strengthBarInner = document.getElementById('strength-bar-inner');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
}
function hideError() {
  errorMsg.classList.remove('show');
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Real-time email validation
emailInput.addEventListener('blur', () => {
  if (emailInput.value && !validateEmail(emailInput.value)) {
    emailInput.classList.add('error');
    emailHint.classList.add('show');
  } else {
    emailInput.classList.remove('error');
    emailHint.classList.remove('show');
  }
});
emailInput.addEventListener('input', () => {
  if (validateEmail(emailInput.value)) {
    emailInput.classList.remove('error');
    emailHint.classList.remove('show');
  }
  hideError();
});

// Password visibility toggle
togglePw.addEventListener('click', () => {
  const isHidden = passwordInput.type === 'password';
  passwordInput.type = isHidden ? 'text' : 'password';
  togglePw.textContent = isHidden ? '🙈' : '👁';
  togglePw.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
});

// Password strength meter
passwordInput.addEventListener('input', () => {
  const val = passwordInput.value;
  passwordHint.classList.remove('show');
  hideError();

  if (!val) { strengthBar.classList.remove('show'); return; }
  strengthBar.classList.add('show');

  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;

  const widths = ['0%', '25%', '50%', '75%', '100%'];
  const colors = ['#e2e8f0', '#ef4444', '#f59e0b', '#22c55e', '#22c55e'];
  strengthBarInner.style.width = widths[score];
  strengthBarInner.style.background = colors[score];
});

// Form submit
form.addEventListener('submit', (e) => {
  e.preventDefault();
  hideError();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  // Validation
  if (!email) {
    emailInput.classList.add('error');
    emailHint.textContent = 'Email is required.';
    emailHint.classList.add('show');
    emailInput.focus();
    return;
  }
  if (!validateEmail(email)) {
    emailInput.classList.add('error');
    emailHint.textContent = 'Please enter a valid email address.';
    emailHint.classList.add('show');
    emailInput.focus();
    return;
  }
  if (!password) {
    passwordHint.classList.add('show');
    passwordInput.focus();
    return;
  }

  // Clear field errors
  emailInput.classList.remove('error');
  emailHint.classList.remove('show');
  passwordHint.classList.remove('show');

  // Loading state
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  const remember = document.getElementById('remember').checked;
  Auth.login(email, password, remember).then(function(result) {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    if (result.success) {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'dashboard.html';
      window.location.href = redirect;
    } else {
      showError(result.error || 'Sign in failed. Please try again.');
    }
  });
});

// Social sign-in
document.getElementById('google-signin').addEventListener('click', function() {
  Auth.loginWithGoogle().then(function(result) {
    if (result.success) {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect') || 'dashboard.html';
      window.location.href = redirect;
    } else {
      showError(result.error || 'Google sign-in failed. Please try again.');
    }
  });
});

document.getElementById('github-signin').addEventListener('click', function() {
  showError('GitHub sign-in is not configured. Use Google or email/password.');
});
</script>
</body>
</html>
