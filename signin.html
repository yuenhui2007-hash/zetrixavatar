<style>
.signin-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 24px 40px;
  background: linear-gradient(135deg, #000000 0%, #1a1a1a 40%, #0f172a 100%);
}
.signin-card {
  background: var(--card-bg);
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--border-color);
}
.signin-logo {
  text-align: center;
  margin-bottom: 28px;
}
.signin-logo img {
  height: 40px;
  display: inline-block;
}
.signin-logo h2 {
  font-size: 1.4rem;
  font-weight: 800;
  margin-top: 12px;
  color: var(--dark);
}
.signin-logo p {
  font-size: 0.85rem;
  color: var(--gray);
  margin-top: 4px;
}

.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--dark);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius);
  background: var(--body-bg);
  color: var(--body-text);
  font-size: 0.95rem;
  transition: var(--transition);
}
.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.1);
}
.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 0.8rem;
}
.form-options label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--gray);
  cursor: pointer;
}
.form-options a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}
.form-options a:hover {
  text-decoration: underline;
}

.btn-block {
  width: 100%;
  padding: 13px;
  font-size: 1rem;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: var(--gray);
  font-size: 0.78rem;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-color);
}

.social-signin {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 11px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border-color);
  background: var(--body-bg);
  color: var(--body-text);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}
.btn-social:hover {
  background: var(--gray-light);
}
.btn-social svg {
  width: 18px;
  height: 18px;
}

.signin-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.85rem;
  color: var(--gray);
}
.signin-footer a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
}
.signin-footer a:hover {
  text-decoration: underline;
}

.error-msg {
  background: rgba(230, 0, 18, 0.08);
  border: 1px solid rgba(230, 0, 18, 0.2);
  color: #B3000E;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
}
.error-msg.show { display: block; }

[data-theme="dark"] .signin-page,
.dark .signin-page {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #000000 100%);
}
[data-theme="dark"] .btn-social,
.dark .btn-social {
  background: #1e293b;
  border-color: rgba(255,255,255,0.08);
}
[data-theme="dark"] .btn-social:hover,
.dark .btn-social:hover {
  background: #334155;
}
</style>
</head>
<body>
<nav class="navbar" id="navbar" aria-label="Main navigation"></nav>
<script src="js/nav.js?v=14"></script>

<section class="signin-page">
  <div class="signin-card">
    <div class="signin-logo">
      <a href="index.html"><img src="assets/logo-zetrix-new.png" alt="Zetrix" loading="lazy"></a>
      <h2>Welcome back</h2>
      <p>Sign in to continue your AI journey</p>
    </div>

    <div class="error-msg" id="error-msg">Invalid email or password.</div>

    <form id="signin-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <div class="form-options">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="divider">or continue with</div>

    <div class="social-signin">
      <button class="btn-social" id="google-signin" type="button">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="btn-social" id="github-signin" type="button">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
        GitHub
      </button>
    </div>

    <div class="signin-footer">
      Don't have an account? <a href="#">Get started</a>
    </div>
  </div>
</section>

<script src="js/theme.js?v=14"></script>
<script>
const form = document.getElementById('signin-form');
const errorMsg = document.getElementById('error-msg');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    errorMsg.textContent = 'Please enter both email and password.';
    errorMsg.classList.add('show');
    return;
  }

  // Placeholder: wire to your auth backend (Firebase, Supabase, custom API)
  console.log('Sign in attempt:', { email, remember: document.getElementById('remember').checked });

  // Demo: simulate success after 800ms
  const btn = form.querySelector('button[type="submit"]');
  const originalText = btn.textContent;
  btn.textContent = 'Signing in...';
  btn.disabled = true;

  setTimeout(() => {
    // In production, redirect on success:
    // window.location.href = 'dashboard.html';
    btn.textContent = originalText;
    btn.disabled = false;
    errorMsg.textContent = 'Demo mode — sign-in backend not connected.';
    errorMsg.classList.add('show');
  }, 800);
});

document.getElementById('google-signin').addEventListener('click', () => {
  console.log('Google sign-in clicked');
  // Wire to OAuth provider
});

document.getElementById('github-signin').addEventListener('click', () => {
  console.log('GitHub sign-in clicked');
  // Wire to OAuth provider
});
</script>
</body>
</html>
