          title: "From Prompts to Processes",
          content: `<h3>Turning One-Off Prompts into Repeatable Workflows</h3>
          <p>Most people use AI for single tasks. The real power comes from chaining prompts into end-to-end processes. This segment shows you how.</p>

          <h3>Case Study: How TerraForma Saved 15 Hours/Week</h3>
          <p>TerraForma, a 12-person sustainability consultancy, was drowning in manual reporting. Every Friday, three team members spent 5 hours each compiling client updates from spreadsheets, emails, and meeting notes into formatted PDFs. After implementing a semi-automated workflow, the process now takes 30 minutes of human review:</p>
          <ul>
            <li><strong>Trigger:</strong> Friday 14:00 — calendar event fires.</li>
            <li><strong>Step 1:</strong> Agent pulls data from Google Sheets (project hours, milestones, budgets).</li>
            <li><strong>Step 2:</strong> Agent scans email threads for client communications from that week.</li>
            <li><strong>Step 3:</strong> Agent drafts a personalised update for each of 8 clients using a branded template.</li>
            <li><strong>Step 4:</strong> Drafts land in a "Review Queue" folder. The account lead checks, tweaks tone, clicks approve.</li>
            <li><strong>Step 5:</strong> Agent converts to PDF, attaches logos, and emails each client by 17:00.</li>
          </ul>
          <p><strong>Result:</strong> 15 hours reclaimed weekly. Zero missed deadlines. Client satisfaction scores rose 22% because updates became consistent and predictable.</p>

          <h3>The Automation Spectrum Framework</h3>
          <p>Not every task should be fully automated. Use this framework to decide where on the spectrum your workflow belongs:</p>
          <ol>
            <li><strong>Ad-hoc Prompt (Level 0):</strong> "Write a thank-you email to Sarah." One input, one output, no memory. Human does everything except the draft.</li>
            <li><strong>Templated Prompt (Level 1):</strong> "Write a thank-you email to [NAME] for [REASON]." Reusable but still manual. Good for tasks done 1–2×/month.</li>
            <li><strong>Semi-Automated Workflow (Level 2):</strong> Trigger → AI action → Human review → Send. Example: draft email, you approve, then it sends. Best for tasks with high stakes or external visibility.</li>
            <li><strong>Fully Automated Process (Level 3):</strong> Trigger → AI action → Send → Log → Notify. No human in the loop. Reserved for low-risk, high-volume, proven tasks.</li>
          </ol>
          <p><em>Rule of thumb:</em> Start at Level 2. Only graduate to Level 3 after 10 consecutive flawless runs with no meaningful edits.</p>

          <h3>The 5-Stage Prompt-to-Process Pipeline</h3>
          <p>Before you open any workflow builder, work through these stages on paper:</p>
          <ol>
            <li><strong>Isolate:</strong> Pick ONE repetitive task. Criteria: &gt;3×/week, &gt;15 min each time, low creative variance.</li>
            <li><strong>Perfect:</strong> Write the prompt manually 5–10 times. Refine until output is 90%+ correct without edits. Document what "correct" means.</li>
            <li><strong>Template:</strong> Identify variables. Replace names, dates, amounts with placeholders like <code>{{ client.name }}</code> or <code>{{ report.period }}</code>.</li>
            <li><strong>Connect:</strong> Where do inputs live? Calendar, CRM, spreadsheet, email? Map data sources to variables.</li>
            <li><strong>Automate:</strong> Build the workflow. Add triggers, actions, and (initially) a human approval gate.</li>
          </ol>

          <h3>Real Examples from Zetrix Users</h3>
          <table style="width:100%;border-collapse:collapse;margin:1em 0;">
            <tr style="background:var(--surface);"><th style="padding:8px;border:1px solid var(--border);">Industry</th><th style="padding:8px;border:1px solid var(--border);">Task</th><th style="padding:8px;border:1px solid var(--border);">Automation Level</th><th style="padding:8px;border:1px solid var(--border);">Time Saved</th></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Legal</td><td style="padding:8px;border:1px solid var(--border);">Contract first-pass review</td><td style="padding:8px;border:1px solid var(--border);">Level 2</td><td style="padding:8px;border:1px solid var(--border);">8 hrs/week</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">E-commerce</td><td style="padding:8px;border:1px solid var(--border);">Abandoned-cart personalised emails</td><td style="padding:8px;border:1px solid var(--border);">Level 3</td><td style="padding:8px;border:1px solid var(--border);">12 hrs/week</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Consulting</td><td style="padding:8px;border:1px solid var(--border);">Weekly client status reports</td><td style="padding:8px;border:1px solid var(--border);">Level 2 → 3</td><td style="padding:8px;border:1px solid var(--border);">15 hrs/week</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Recruitment</td><td style="padding:8px;border:1px solid var(--border);">CV screening against job description</td><td style="padding:8px;border:1px solid var(--border);">Level 2</td><td style="padding:8px;border:1px solid var(--border);">10 hrs/week</td></tr>
            <tr><td style="padding:8px;border:1px solid var(--border);">Finance</td><td style="padding:8px;border:1px solid var(--border);">Expense report categorisation</td><td style="padding:8px;border:1px solid var(--border);">Level 3</td><td style="padding:8px;border:1px solid var(--border);">6 hrs/week</td></tr>
          </table>

          <h3>Step-by-Step: Building Your First Workflow in Zetrix</h3>
          <ol>
            <li>Identify a repetitive task you do at least 3 times per week. Example: sending follow-up emails after meetings.</li>
            <li>Write the perfect prompt for this task manually. Refine it until the output is 90% correct.</li>
            <li>Go to <strong>Agent Studio &gt; Workflows</strong> and click <strong>Create Workflow</strong>.</li>
            <li>Define the <strong>trigger</strong>. Options: calendar event ends, new email arrives, form submission, scheduled time, or manual button.</li>
            <li>Add an <strong>AI action</strong>. Paste your refined prompt. Use variables like <code>{{ attendee.name }}</code> and <code>{{ meeting.topic }}</code>.</li>
            <li>Add a <strong>human approval gate</strong> (recommended for early workflows). The Avatar drafts the output; you click approve or edit.</li>
            <li>Add a <strong>send action</strong>. Connect Gmail or your email provider. Set the recipient dynamically.</li>
            <li>Add a <strong>log action</strong>. Save a record to a Google Sheet or Notion database for tracking.</li>
            <li>Save and activate. Test with a real trigger.</li>
          </ol>
          <p><strong>Golden Rule:</strong> Start semi-automated. Only remove the human gate after 10 consecutive flawless runs.</p>

          <h3>Anti-Patterns to Avoid</h3>
          <ul>
            <li><strong>Automation for automation's sake:</strong> If a task takes 2 minutes and happens once a month, don't automate it. The setup cost exceeds the benefit.</li>
            <li><strong>Skipping the manual phase:</strong> Never build a workflow for a prompt you haven't manually perfected. You'll automate garbage at scale.</li>
            <li><strong>Removing approval too early:</strong> One embarrassing auto-sent email to a client destroys trust. Be patient.</li>
            <li><strong>No logging:</strong> If you can't see what your automation did, you can't debug it. Always log.</li>
          </ul>`,

          title: "Email Automation Mastery",
          content: `<h3>Let Your Avatar Handle Your Inbox</h3>
          <p>Email is where productivity dies. The average knowledge worker checks email 15 times per day and spends 2.6 hours daily in their inbox. Reclaim your time with intelligent email automation.</p>

          <h3>Case Study: Meridian Legal's Inbox Zero Transformation</h3>
          <p>Meridian Legal, a 25-lawyer firm, received 3,000+ emails weekly. Junior associates spent 4 hours daily triaging, routing, and drafting routine replies. After deploying three specialised email agents:</p>
          <ul>
            <li><strong>Inbox Triage Agent:</strong> Categorises every incoming email within 30 seconds. Urgent matters ping the relevant lawyer on Slack. Newsletters are batch-summarised at 17:00.</li>

          </ul>
          <p><strong>Result:</strong> Associates reclaimed 3.5 hours daily. Client response time dropped from 26 hours to 3 hours. The firm onboarded 40% more clients without hiring additional staff.</p>

          <h3>The Email Automation Framework: TRIAGE → ACT → TRACK</h3>
          <ol>
            <li><strong>TRIAGE:</strong> Classify every incoming email by urgency, sender importance, and action required. Think of it as an emergency room for your inbox.</li>
            <li><strong>ACT:</strong> Draft replies, create tasks, schedule meetings, or delegate. The Avatar does the heavy lifting; you approve.</li>
            <li><strong>TRACK:</strong> Log every action. Measure: average response time, emails triaged, accuracy of categorisation. Optimise weekly.</li>
          </ol>

          <h3>Step-by-Step: Setting Up Email Agents</h3>
          <ol>
            <li>Go to <strong>Integrations &gt; Email</strong> and connect your Gmail or Outlook account. Grant read and send permissions.</li>
            <li>Create an <strong>Inbox Triage Agent</strong>:
              <ul>
                <li>Prompt: "Analyse the sender, subject, and body. Categorise as: Urgent, To Read, Delegate, Newsletter, or Spam. For Urgent, extract the core ask and summarise in one sentence."</li>
                <li>Trigger: New email arrives.</li>
                <li>Action: Label the email and send a brief summary to Slack if marked Urgent.</li>
              </ul>
            </li>

              <ul>
                <li>Prompt: "If an email from a client or prospect has not been replied to in 48 hours, draft a polite follow-up that references the original topic. Match the tone of previous correspondence."</li>
                <li>Trigger: Daily at 09:00.</li>
                <li>Action: Draft follow-ups in a "Follow-Up Drafts" label for your review.</li>
              </ul>
            </li>
            <li>Create an <strong>Auto-Responder Agent</strong>:
              <ul>
                <li>Prompt: "If the email asks a common question, reply using the FAQ document in PKM. If unsure, flag for human review. Never make up pricing or policy details."</li>
                <li>Trigger: New email arrives containing keywords "pricing," "demo," "hours," or "support."</li>
                <li>Action: Send the reply immediately (no approval needed for FAQs after 20 flawless runs).</li>
              </ul>
            </li>
            <li>Review the <strong>Email Analytics</strong> dashboard weekly. Track: emails triaged, auto-replied, draft accuracy, and average response time.</li>
          </ol>

          <h3>Best Practices & Guardrails</h3>
          <ul>
            <li>Always start with a "draft only" mode. Never auto-send until accuracy is proven over 10+ runs.</li>
            <li>Maintain an <strong>email style guide</strong> in your PKM. The Avatar references it for tone consistency. Include: greeting style, sign-off, formality level, and words to avoid.</li>
            <li>Use <strong>exclusion rules</strong> for sensitive senders (CEO, investors, family, board members). These always go to human review.</li>
            <li>Set a <strong>confidence threshold</strong>. If the Avatar is less than 85% confident in its categorisation or reply, escalate to human.</li>
            <li><strong>CC/BCC awareness:</strong> Train your agent to recognise when an email has multiple recipients and adjust tone accordingly.</li>
          </ul>

          <h3>Real Email Templates for Your PKM</h3>
          <p>Store these in your PKM so the Avatar can reference them:</p>
          <ul>
            <li><strong>Decline Template:</strong> Polite but firm meeting decline with alternative suggestions.</li>
            <li><strong>Introduction Template:</strong> Warm, context-rich intro between two contacts.</li>
            <li><strong>Follow-Up Template:</strong> Gentle reminder referencing previous commitment or deadline.</li>
            <li><strong>Out-of-Office Template:</strong> Smart OOO that routes urgent items to a colleague.</li>
          </ul>`,

        {
          title: "Agent Studio Fundamentals",
          content: `<h3>Building Custom Agents from Scratch</h3>
          <p>Agent Studio is where you turn your Avatar into a team of specialists. This segment is your guided tour from blank canvas to production-ready agent.</p>

          <h3>Case Study: How NexaHealth Built a Clinical Documentation Agent</h3>
          <p>NexaHealth, a telehealth provider, needed to summarise patient consultations into structured clinical notes. Doctors spent 20 minutes per appointment on documentation. Using Agent Studio:</p>
          <ul>
            <li>They created a <strong>Clinical Scribe Agent</strong> with a detailed system prompt defining medical terminology, note structure (SOAP format), and privacy constraints (HIPAA alignment).</li>
            <li>The agent connects to their transcription API (input: raw transcript) and outputs structured notes in their EHR format.</li>
            <li>Doctors review and approve notes in under 2 minutes per case.</li>
          </ul>
          <p><strong>Result:</strong> Documentation time dropped from 20 to 2 minutes. Doctor satisfaction increased because they could see more patients or finish on time. The agent is now used by 40+ clinicians.</p>

          <h3>The Agent Design Canvas Framework</h3>
          <p>Before writing a single prompt, answer these six questions on the canvas:</p>
          <ol>
            <li><strong>Identity:</strong> Who is this agent? (e.g., "You are a meticulous financial analyst with 10 years of experience in SaaS metrics.")</li>
            <li><strong>Goal:</strong> What is its single primary output? (e.g., "Produce a one-page executive summary of Q3 financials.")</li>
            <li><strong>Inputs:</strong> What data does it need? Be specific about format and source.</li>
            <li><strong>Process:</strong> What steps should it follow? (e.g., "1. Read data → 2. Identify anomalies → 3. Draft summary → 4. Suggest actions.")</li>
            <li><strong>Constraints:</strong> What must it never do? (e.g., "Never disclose sensitive customer data. Never invent statistics.").</li>
            <li><strong>Output Format:</strong> How should the result look? Provide a template or example.</li>
          </ol>

          <h3>Step-by-Step: Creating a Custom Agent</h3>
          <ol>
            <li>Navigate to <strong>Agent Studio</strong> from the Dashboard.</li>
            <li>Click <strong>New Agent</strong>. Choose a starter template or start blank.</li>
            <li>Name your agent descriptively. Example: "Q3-Report-Generator." Bad name: "Agent 1."</li>
            <li>Write the <strong>System Prompt</strong> using the Agent Design Canvas. Example:
              <blockquote>"You are a financial analyst. You read spreadsheets and produce executive summaries. Use bullet points. Be conservative with projections. Cite specific cell references. Never round percentages."</blockquote>
            </li>
            <li>Define <strong>Inputs</strong>. What data does the agent need? Example: a spreadsheet file, a date range, and a comparison flag (YoY or QoQ).</li>
            <li>Define <strong>Outputs</strong>. What does the agent produce? Example: a markdown report, a chart image, and an email draft.</li>
            <li>Add <strong>Tools</strong>. Which integrations does the agent use? Spreadsheet reader, chart generator, email sender, etc.</li>
            <li>Set <strong>Memory Scope</strong>. Can the agent access your full PKM, or only specific folders? Limit scope for speed, accuracy, and privacy.</li>
            <li>Test the agent with sample inputs. Iterate on the system prompt until outputs are consistent across 5+ test runs.</li>
            <li>Publish the agent. It now appears in your Avatar's agent library and can be triggered by voice or chat.</li>
          </ol>

          <h3>Agent Templates to Explore</h3>

            <li><strong>Data Analyst:</strong> Reads CSVs, finds trends, generates charts. Best for: weekly metrics, sales pipelines, inventory reports.</li>
            <li><strong>Copywriter:</strong> Writes ads, emails, and landing pages in your brand voice. Best for: marketing teams with high content volume.</li>
            <li><strong>Meeting Scribe:</strong> Summarises transcripts, extracts action items, assigns owners. Best for: project managers and team leads.</li>
            <li><strong>Researcher:</strong> Searches the web, summarises findings, cites sources. Best for: competitive analysis and due diligence.</li>
            <li><strong>Customer Support:</strong> Drafts replies to common tickets, escalates complex issues. Best for: support teams with repeatable queries.</li>
          </ul>

          <h3>Testing & Iteration Best Practices</h3>
          <ul>
            <li>Create a <strong>test suite</strong> of 5–10 diverse inputs. Run each after every prompt change. Track pass/fail.</li>
            <li>Use <strong>A/B prompting</strong>. Save two versions of your system prompt. Test both against the same inputs. Keep the winner.</li>
            <li>Document <strong>failure modes</strong>. When the agent gets it wrong, save the input and expected output in a "Agent QA" PKM folder. Feed these back into prompt refinement.</li>
            <li>Version your agents. Name them "Report-Agent-v1.2" so you can roll back if a change breaks performance.</li>
          </ul>`,

        {

          content: `<h3>Onboarding That Runs Itself</h3>
          <p>A great onboarding experience sets the tone for retention. Companies with strong onboarding improve new hire retention by 82% and productivity by over 70%. Automate it without losing the human touch.</p>

          <h3>Case Study: CloudStride's 90-Day Automated Onboarding</h3>
          <p>CloudStride, a 200-person cloud consultancy, was losing new hires in the first 6 months. Feedback showed confusion about role expectations, slow IT access, and inconsistent manager check-ins. They built a comprehensive onboarding automation:</p>

        {
          title: "Document Review Workflows",
          content: `<h3>Automating Contracts, Policies, and Reports</h3>
          <p>Document review is tedious but critical. A missed clause in a contract can cost millions. Let your Avatar handle the first pass so you focus on decisions, not drudgery.</p>

          </table>

          <h3>Step-by-Step: Adding Error Handling</h3>
          <ol>
            <li>In <strong>Workflow Editor</strong>, click any action and open <strong>Error Settings</strong>.</li>
            <li>Set a <strong>retry policy</strong>: 3 retries with exponential backoff (wait 5s, then 15s, then 45s). Never use fixed intervals.</li>
            <li>Add a <strong>fallback action</strong>: If retries fail, send a Slack message to the workflow owner with full context.</li>
            <li>For <strong>AI actions</strong>, enable <strong>output validation</strong>. Define rules: output must contain X, must be under Y words, must reference a real document, must not contain "I don't know" or hallucination markers.</li>
            <li>Add a <strong>human approval gate</strong> for any action that modifies external systems (sending emails, updating CRM, posting to Slack).</li>
            <li>Schedule a <strong>weekly health check</strong>. The Avatar emails you a summary of all failures, retries, and fallbacks from the past 7 days.</li>
            <li>Maintain a <strong>runbook</strong> in your PKM: "If Workflow X fails, check Y, then do Z." Update after every incident.</li>
          </ol>

          <h3>Graceful Degradation Checklist</h3>
          <ul>
            <li>Never let a failed auto-reply send a second, duplicate email. Use idempotency keys.</li>
            <li>If a calendar sync fails, do not delete existing events. Preserve data at all costs.</li>
            <li>If AI output fails validation, queue for human review rather than sending garbage.</li>
            <li>If a downstream API is down, queue work for later. Don't drop it.</li>
            <li>Log every error with context (timestamp, inputs, stack trace) for debugging.</li>
            <li>Test your failure paths. Deliberately break things in a test environment to see how the system behaves.</li>
