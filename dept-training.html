<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Training — LearnAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--body-bg);color:var(--body-text);min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:24px}
.dept-hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:100px 24px 48px;text-align:center;border-radius:0 0 24px 24px;margin-bottom:32px}
.dept-hero h1{font-size:2rem;margin-bottom:8px}
.dept-hero p{opacity:.85}
.progress-tracker{background:var(--card-bg);padding:20px 24px;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:24px;display:flex;align-items:center;gap:16px}
.progress-tracker .bar{flex:1;height:10px;background:var(--gray-light);border-radius:50px;overflow:hidden}
.progress-tracker .fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:0%;transition:width .5s}
.lesson-card{background:var(--card-bg);padding:28px;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:20px;border-left:4px solid #6366f1}
.lesson-card h3{font-size:1.1rem;margin-bottom:12px}
.lesson-card ul{padding-left:20px;line-height:1.9;color:#475569}
.lesson-card .tag{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:4px 12px;border-radius:50px;font-size:.75rem;font-weight:600;margin-bottom:12px}
.practice-box{background:var(--light);border:1px solid var(--gray-light);padding:20px;border-radius:12px;margin:16px 0}
.practice-box h4{color:#166534;margin-bottom:8px}
.assignment-box{background:var(--light);border:2px solid var(--gray-light);padding:24px;border-radius:12px;margin:20px 0}
.assignment-box h4{color:#9a3412;margin-bottom:12px}
.assignment-box textarea{width:100%;min-height:100px;padding:12px;border:1px solid #fed7aa;border-radius:8px;font-family:inherit;font-size:.9rem;margin:12px 0;resize:vertical}
.assignment-box textarea:focus{outline:none;border-color:#f97316}
.assignment-box .deliverables{background:var(--card-bg);padding:16px;border-radius:8px;border:1px solid #fed7aa;margin:12px 0}
.assignment-box .deliverables li{margin-bottom:6px;color:#7c2d12}
.assignment-status{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:50px;font-size:.8rem;font-weight:600;margin-top:8px}
.assignment-status.pending{background:var(--light);color:var(--body-text)}
.assignment-status.submitted{background:var(--light);color:var(--body-text)}
.submit-work-btn{background:var(--secondary);color:var(--white);border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:8px}
.submit-work-btn:disabled{background:var(--gray-light);cursor:not-allowed}
.lock-msg{background:#fee2e2;color:#991b1b;padding:16px;border-radius:12px;margin:16px 0;text-align:center}
[data-theme="dark"] .lock-msg, .dark .lock-msg { background: #450a0a; color: #f87171; }
.quiz-locked{opacity:.5;pointer-events:none;filter:grayscale(.5)}
.quiz-box{background:var(--light);border:2px solid var(--gray-light);padding:28px;border-radius:16px;margin:24px 0}
.quiz-box h3{margin-bottom:16px}
.quiz-question{margin-bottom:16px}
.quiz-question p{font-weight:600;margin-bottom:8px}
.quiz-options label{display:block;padding:10px 14px;margin-bottom:6px;background:var(--card-bg);border:1px solid var(--gray-light);border-radius:8px;cursor:pointer;transition:.2s}
.quiz-options label:hover{border-color:var(--primary);background:var(--primary-light)}
.quiz-options input{margin-right:8px}
.quiz-result{margin-top:16px;padding:16px;border-radius:12px;display:none}
.nav-btns{display:flex;gap:12px;margin-top:32px}
.nav-btns a,.nav-btns button{padding:12px 24px;border-radius:10px;text-decoration:none;font-weight:600;border:none;cursor:pointer;font-size:.9rem}
.btn-primary{background:#6366f1;color:#fff}
.btn-secondary{background:var(--light);color:var(--body-text)}
.completed-badge{display:inline-flex;align-items:center;gap:6px;background:var(--light);color:var(--body-text);padding:6px 14px;border-radius:50px;font-size:.8rem;font-weight:600;margin-left:12px}
</style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="container nav-container" style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px">
    <a href="index.html" class="logo"><span style="font-size:1.3rem">🎓</span> <span style="font-weight:700">LearnAI</span></a>

</div>

      {title:'Board & Investor Comms',tag:'Module 2',items:['Draft executive summaries','Build KPI dashboards','Write investor updates','Prepare board decks'],practice:'Draft a quarterly investor update: 3 achievements, 2 challenges, and 1 strategic pivot.',assignment:{title:'Comms Assignment',deliverables:['Submit an executive summary or investor update (min 150 words)','List 3 KPIs with current vs target values','Paste your AI prompt and outline'],locked:true}},
      {title:'Decision Support',tag:'Module 3',items:['Model scenarios','Assess risks','Evaluate options','Build decision trees'],practice:'Present a major decision to AI. Ask it to: (1) list pros/cons, (2) model 3 scenarios, (3) flag risks.',assignment:{title:'Decision Assignment',deliverables:['Describe a real decision you face','Submit pros/cons list + 3 scenarios','Submit risk assessment (min 100 words)'],locked:true}},
      {title:'Leadership & Culture',tag:'Module 4',items:['Draft town hall speeches','Write culture documents','Plan team communications','Create vision statements'],practice:'Ask AI to draft a town hall speech announcing a company restructuring, focusing on transparency and optimism.',assignment:{title:'Leadership Assignment',deliverables:['Submit a town hall speech or culture doc (min 200 words)','Explain the key message and tone choices','Paste your AI prompt and audience context'],locked:true}}
    ],

      {q:'What should executives use AI for?',a:'b',opts:['Replacing board votes','Decision support and analysis','Hiring without interviews']},
      {q:'Can AI draft board reports?',a:'b',opts:['No, too sensitive','Yes, as drafts for executive review','Only for public companies']},
      {q:'What is scenario modelling?',a:'a',opts:['Exploring possible futures based on variables','Building physical models','Creating 3D designs']},
      {q:'Should AI make strategic decisions?',a:'b',opts:['Yes, it has more data','No, humans make final decisions','Only for cost-cutting']},
      {q:'What is a key benefit of AI for executives?',a:'a',opts:['Faster synthesis of complex information','Replacing intuition','Eliminating meetings']}

const data = departments[dept] || departments.hr;
const API_BASE = 'https://learnai-backend-n0df.onrender.com';

document.getElementById('deptTitle').textContent = data.title;
document.getElementById('deptDesc').textContent = data.desc;
document.getElementById('deptHero').style.background = `linear-gradient(135deg,${data.color},#1e293b)`;

const container = document.getElementById('lessonsContainer');
const STORAGE_KEY = 'dept_progress_' + dept;

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {lessons:[],assignments:{},quiz:false,score:0}; }
  catch { return {lessons:[],assignments:{},quiz:false,score:0}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); updateUI(); }

function isAssignmentUnlocked(i) {
  if (i === 0) return true;
  const p = getProgress();
  return p.assignments[i-1] && p.assignments[i-1].submitted;
}

function allAssignmentsSubmitted() {
  const p = getProgress();
  return data.lessons.every((_,i) => p.assignments[i] && p.assignments[i].submitted);
}

function renderLessons() {
  const prog = getProgress();
  container.innerHTML = data.lessons.map((l,i) => {
    const done = prog.lessons.includes(i);
    const unlocked = isAssignmentUnlocked(i);
    const asgn = prog.assignments[i] || {};
    const a = l.assignment;
    return `<div class="lesson-card" style="border-left-color:${data.color}">
      <span class="tag" style="background:${data.color}15;color:${data.color}">${l.tag}</span>
      <h3>${l.title}${done ? '<span class="completed-badge">✓ Completed</span>' : ''}</h3>
      <ul>${l.items.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="practice-box"><h4>🎯 Practice Task</h4><p>${l.practice}</p></div>
      <button class="btn-primary" style="padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;margin-top:8px" onclick="markLessonDone(${i})">${done ? 'Reviewed' : 'Mark Complete'}</button>
      ${!unlocked ? `<div class="lock-msg">🔒 Complete the previous assignment to unlock</div>` : `
      <div class="assignment-box" id="asgn-${i}">
        <h4>✏️ ${a.title}</h4>
        <p style="color:var(--gray);font-size:.85rem;margin-bottom:8px">Complete and submit all deliverables below to proceed.</p>
        <div class="deliverables">
          <strong>Deliverables:</strong>
          <ul style="margin-top:8px">${a.deliverables.map(d=>`<li>${d}</li>`).join('')}</ul>
        </div>
        ${asgn.submitted ? `
          <div class="assignment-status submitted">✓ Submitted — ${asgn.wordCount || 0} words</div>
          ${asgn.graded ? `
            <div style="margin-top:12px;padding:16px;border-radius:12px;background:${asgn.band === 'Excellent' ? '#dcfce7' : asgn.band === 'Good' ? '#dbeafe' : asgn.band === 'Satisfactory' ? '#fef3c7' : '#fee2e2'};border:1px solid ${asgn.band === 'Excellent' ? '#22c55e' : asgn.band === 'Good' ? '#3b82f6' : asgn.band === 'Satisfactory' ? '#f59e0b' : '#ef4444'}">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <span style="font-size:1.5rem;font-weight:800;color:${asgn.band === 'Excellent' ? '#22c55e' : asgn.band === 'Good' ? '#3b82f6' : asgn.band === 'Satisfactory' ? '#f59e0b' : '#ef4444'}">${asgn.score}%</span>
                <span style="font-weight:700;color:${asgn.band === 'Excellent' ? '#22c55e' : asgn.band === 'Good' ? '#3b82f6' : asgn.band === 'Satisfactory' ? '#f59e0b' : '#ef4444'}">${asgn.band}</span>
              </div>
              <p style="font-size:.85rem;color:var(--gray);margin-bottom:8px">🤖 Automated feedback:</p>
              <ul style="font-size:.85rem;line-height:1.6;padding-left:18px">
                ${asgn.feedback.map(f => '<li>' + f + '</li>').join('')}
              </ul>
              <p style="font-size:.75rem;color:var(--gray);margin-top:8px;font-style:italic">This is an automated preliminary grade. Your manager may review and adjust.</p>
            </div>
          ` : ''}
          <button class="submit-work-btn" onclick="reopenAssignment(${i})">Edit Submission</button>
        ` : `
          <textarea id="work-${i}" placeholder="Type your assignment here... Paste prompts, outputs, and explanations.">${asgn.draft || ''}</textarea>
          <button class="submit-work-btn" onclick="submitAssignment(${i})">Submit Assignment</button>
        `}
      </div>`}
    </div>`;
  }).join('');
}

function markLessonDone(i) {
  const p = getProgress();
  if (!p.lessons.includes(i)) p.lessons.push(i);
  saveProgress(p);
}

async function submitAssignment(i) {
  const text = document.getElementById('work-'+i).value.trim();
  if (text.length < 50) { alert('Assignment too short. Minimum 50 characters.'); return; }
  const p = getProgress();
  if (!p.assignments) p.assignments = {};

  // Auto-grade the submission
  const grade = gradeAssignment(text, i);

  p.assignments[i] = { submitted: true, graded: true, draft: text, wordCount: grade.wordCount, score: grade.score, band: grade.band, feedback: grade.feedback, date: new Date().toISOString() };
  saveProgress(p);

  // Sync to backend
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  const userId = user.id || localStorage.getItem('auth_user_id') || 'anonymous';
  try {
    await fetch(API_BASE + '/api/admin/assignments/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, dept, moduleIndex: i, moduleTitle: data.lessons[i].title, assignmentTitle: data.lessons[i].assignment.title, content: text, score: grade.score, band: grade.band })
    });
  } catch(e) { console.log('Backend sync failed', e); }
}

function reopenAssignment(i) {
  const p = getProgress();
  if (p.assignments[i]) { p.assignments[i].submitted = false; p.assignments[i].graded = false; }
  saveProgress(p);
}

function gradeAssignment(text, i) {
  const a = data.lessons[i].assignment;
  const deliverables = a.deliverables || [];
  const wordCount = text.split(/\s+/).filter(w => w.length > 0).length;
  const sectionCount = text.split(/\n{2,}/).filter(s => s.trim().length > 20).length;
  const hasList = /(\n\s*[-•*\d]\s+.{10,}){2,}/.test(text);
  const lower = text.toLowerCase();

  // Dynamic keyword extraction from deliverables
  const keywordHints = [];
  deliverables.forEach(d => {
    const words = d.toLowerCase().match(/[a-z]{4,}/g) || [];
    words.forEach(w => { if (!['submit','your','with','and','the','for','min','words','paste','you','would'].includes(w)) keywordHints.push(w); });
  });
  const uniqueKeywords = [...new Set(keywordHints)].slice(0, 8);
  const matchedKeywords = uniqueKeywords.filter(k => lower.includes(k)).length;

  let score = 100;
  const feedback = [];

  // Word count penalty
  const minWords = deliverables.some(d => d.includes('min 200')) ? 200 :
                   deliverables.some(d => d.includes('min 150')) ? 150 :
                   deliverables.some(d => d.includes('min 100')) ? 100 : 80;
  if (wordCount < minWords * 0.5) { score -= 25; feedback.push('Response is too short. Aim for at least ' + minWords + ' words.'); }
  else if (wordCount < minWords) { score -= 10; feedback.push('Response is a bit short. Try to reach ' + minWords + ' words.'); }

  // Keyword coverage
  const kwRatio = uniqueKeywords.length > 0 ? matchedKeywords / uniqueKeywords.length : 1;
  if (kwRatio < 0.3) { score -= 15; feedback.push('Include more topic-specific terms related to the deliverables.'); }

  // Structure checks
  if (!hasList) { score -= 10; feedback.push('Use bullet points or numbered lists to organise your deliverables.'); }
  if (sectionCount < 2) { score -= 10; feedback.push('Break your response into clearly separated sections.'); }

  // Length bonus
  if (wordCount >= minWords * 1.5 && hasList && sectionCount >= 3) { score += 5; }

  score = Math.max(0, Math.min(100, score));

  // Determine band
  let band, color;
  if (score >= 80) { band = 'Excellent'; color = '#22c55e'; }
  else if (score >= 60) { band = 'Good'; color = '#3b82f6'; }
  else if (score >= 40) { band = 'Satisfactory'; color = '#f59e0b'; }
  else { band = 'Needs Improvement'; color = '#ef4444'; }

  return {
    score,
    band,
    color,
    wordCount,
    feedback: feedback.length ? feedback : ['Well structured! Your submission covers the key requirements.'],
    aiNote: 'This is an automated preliminary grade. Your manager may review and adjust.'
  };
}

function renderQuiz() {
  const form = document.getElementById('quizForm');
  form.innerHTML = data.quiz.map((q,i) => `
    <div class="quiz-question"><p>${i+1}. ${q.q}</p><div class="quiz-options">
      ${q.opts.map((o,ji) => `<label><input type="radio" name="q${i+1}" value="${String.fromCharCode(97+ji)}">${o}</label>`).join('')}
    </div></div>
  `).join('') + '<button type="submit" class="btn-primary" style="margin-top:12px;padding:12px 24px">Submit Quiz</button>';

  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    data.quiz.forEach((q,i) => {
      const sel = form.querySelector(`input[name="q${i+1}"]:checked`);
      const correct = sel && sel.value === q.a;
      if (correct) score++;
      // Show right/wrong per question
      const labels = form.querySelectorAll(`input[name="q${i+1}"]`);
      labels.forEach(inp => {
        const lbl = inp.closest('label');
        if (inp.value === q.a) {
          lbl.style.borderColor = '#22c55e';
          lbl.style.background = '#dcfce7';
          lbl.innerHTML += ' ✅ <span style="color:var(--accent);font-weight:700">+' + (Math.round(100/data.quiz.length)) + '</span>';
        } else if (inp.checked && inp.value !== q.a) {
          lbl.style.borderColor = '#ef4444';
          lbl.style.background = '#fee2e2';
          lbl.innerHTML += ' ❌ <span style="color:#ef4444;font-weight:700">+0</span>';
        }
        inp.disabled = true;
      });
    });
    const pct = Math.round((score/data.quiz.length)*100);
    const res = document.getElementById('quizForm-result');
    res.style.display = 'block';
    const p = getProgress();
    p.quiz = true; p.score = pct;
    saveProgress(p);
    if (pct >= 80) {
      res.innerHTML = `<div style="background:var(--light);padding:16px;border-radius:12px;color:var(--body-text)"><strong>Passed! ${pct}%</strong><br>Department training complete.</div>`;
      document.getElementById('certBtn').style.display = 'inline-block';
    } else {
      res.innerHTML = `<div style="background:var(--light);padding:16px;border-radius:12px;color:var(--body-text)"><strong>Try again. ${pct}%</strong><br>You need 80% to pass.</div>`;
    }
  });
}

function updateUI() {
  const p = getProgress();
  const total = data.lessons.length * 2 + 1;
  const lessonDone = p.lessons.length;
  const asgnDone = data.lessons.filter((_,i) => p.assignments[i] && p.assignments[i].submitted).length;
  const quizDone = p.quiz && p.score >= 80 ? 1 : 0;
  const pct = Math.round(((lessonDone + asgnDone + quizDone)/total)*100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  renderLessons();
  if (!allAssignmentsSubmitted()) {
    document.getElementById('finalQuiz').classList.add('quiz-locked');
    document.getElementById('finalQuiz').insertAdjacentHTML('afterbegin', '<div class="lock-msg" id="quizLockMsg">🔒 Complete all assignments above to unlock the final quiz</div>');
  } else {
    const lm = document.getElementById('quizLockMsg');
    if (lm) lm.remove();
    document.getElementById('finalQuiz').classList.remove('quiz-locked');
  }
  if (p.quiz && p.score >= 80) document.getElementById('certBtn').style.display = 'inline-block';
}

function issueDeptCert() {
  const p = getProgress();
  if (!p.quiz || p.score < 80) { alert('Pass the quiz first.'); return; }
  alert(`🎉 ${data.title} Certificate Earned!\n\nScore: ${p.score}%\nDate: ${new Date().toLocaleDateString()}`);
}

renderQuiz();
updateUI();
</script>
