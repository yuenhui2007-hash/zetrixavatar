        {
          title: "The Marketing Flywheel",
          content: `<h3>Attract, Engage, Delight—On Repeat</h3>
          <p>The marketing flywheel is a self-reinforcing loop where satisfied customers become your best marketers. Unlike the traditional funnel, which ends at purchase, the flywheel never stops spinning. Your Avatar can accelerate every stage.</p>

          <h3>The Three Phases</h3>
          <ol>
            <li><strong>Attract:</strong> Pull in strangers with valuable content, SEO, and social presence. Your Avatar drafts blog posts, optimises headlines, and researches keywords.</li>
            <li><strong>Engage:</strong> Convert visitors into leads through personalised emails, landing pages, and chat. Your Avatar segments audiences and writes tailored copy.</li>
            <li><strong>Delight:</strong> Turn customers into promoters with exceptional support, surprise bonuses, and community. Your Avatar monitors sentiment and triggers retention campaigns.</li>
          </ol>

          <h3>Real-World Case Study: HubSpot's Flywheel Revolution</h3>
          <p>HubSpot abandoned the traditional funnel in 2018 and adopted the flywheel model. The result? Their customer acquisition cost dropped 40% over two years because delighted customers referred others organically. Their NPS score became their north-star metric, and they built their entire SaaS platform around reducing friction in the flywheel.</p>

          <h3>Framework: The Friction Audit</h3>
          <p>For each phase, score friction from 1 (seamless) to 5 (impossible):</p>
          <ul>
            <li><strong>Attract friction:</strong> Is your content hard to find? Score 1–5.</li>
            <li><strong>Engage friction:</strong> Is your sign-up process complex? Score 1–5.</li>
            <li><strong>Delight friction:</strong> Is support slow or unhelpful? Score 1–5.</li>
          </ul>
          <p>Your highest score is your priority fix. A score of 4+ in any phase means you are leaking momentum.</p>

          <h3>Real Example: Amazon's Delight Engine</h3>
          <p>Amazon's flywheel spins because of one core principle: customer obsession. They lost money for years to build faster shipping (Prime), easier returns, and personalised recommendations. The result? 70% of Amazon purchases come from the recommendation engine—a pure flywheel effect where past purchases attract future ones.</p>

          <h3>Step-by-Step: Mapping Your Flywheel</h3>
          <ol>
            <li>Open a blank document in your PKM. Title it "Marketing Flywheel – [Your Business]."</li>
            <li>List your top 3 customer acquisition channels today. Example: LinkedIn, Google Ads, referrals.</li>
            <li>For each channel, note: volume of leads, conversion rate, and cost per acquisition.</li>
            <li>Identify the biggest friction point. Where do leads drop off? Example: landing page bounce, email open rate, demo no-shows.</li>
            <li>Ask your Avatar: "Analyse my funnel data and suggest 5 improvements for [friction point]."</li>
            <li>Implement the top suggestion. Measure change over 2 weeks.</li>
            <li>Repeat monthly. The flywheel gets faster with each iteration.</li>
          </ol>

          <h3>Case Study: Glossier's Community-Driven Flywheel</h3>
          <p>Beauty brand Glossier started as a beauty blog (Into The Gloss) before launching products. They attracted readers with authentic content, engaged them by crowdsourcing product ideas, and delighted them by making customers feel like co-creators. Their NPS hovers around 80—double the industry average—because their flywheel is built on community participation.</p>

          <p><strong>Key Metric:</strong> Net Promoter Score (NPS). Ask customers: "How likely are you to recommend us?" Your Avatar can automate the survey and analyse open-text responses.</p>`,

            { q: "Which company publicly abandoned the funnel for the flywheel model in 2018?", options: ["Salesforce", "Amazon", "HubSpot", "Glossier"], correct: 2 },

            { q: "What was Glossier's origin before it became a product company?", options: ["A beauty blog", "A YouTube channel", "A retail store", "A beauty school"], correct: 0 },

        {
          title: "AI-Powered Copywriting",
          content: `<h3>Writing That Converts</h3>
          <p>Great copy is not magic—it is method. The best copywriters use frameworks, not talent alone. Your Avatar can draft, test, and refine copy at scale, but you must guide it with the right inputs.</p>

          <h3>The COPY Framework</h3>
          <ol>
            <li><strong>C – Context:</strong> Who is the reader? What do they know? What do they feel? Feed this to your Avatar in the prompt.</li>
            <li><strong>O – Objective:</strong> What is the one action you want them to take? Click? Buy? Reply? Be specific.</li>
            <li><strong>P – Promise:</strong> What transformation do you offer? Frame it as a before/after.</li>
            <li><strong>Y – You:</strong> Make the reader the hero. Use "you" twice as often as "we."</li>
          </ol>

          <h3>Framework: PAS (Problem-Agitate-Solve)</h3>
          <p>One of the most proven copywriting frameworks in direct response marketing:</p>
          <ul>
            <li><strong>Problem:</strong> State the pain point clearly. "You are losing 5 hours a week to manual data entry."</li>
            <li><strong>Agitate:</strong> Make the pain feel urgent. "That is 260 hours a year—more than 6 work weeks—wasted on copy-paste."</li>
            <li><strong>Solve:</strong> Present your solution as the relief. "Our AI agent eliminates data entry entirely, giving you those 6 weeks back."</li>
          </ul>

          <h3>Real Example: Apple's iPod Launch Copy</h3>
          <p>Apple did not say: "MP3 player with 5GB storage." They said: <em>"1,000 songs in your pocket."</em> That is COPY framework in action—Context (music lovers), Objective (desire the product), Promise (massive portable library), You (your pocket).</p>

          <h3>Case Study: Basecamp's Homepage Rewrite</h3>
          <p>Basecamp (project management tool) A/B tested their headline. Version A: "Basecamp is the best project management tool." Version B: "Basecamp organizes your communication, projects, and client work together so you can calm your work down." Version B increased sign-ups by 14% because it led with the customer's pain (chaos) and promised transformation (calm).</p>

          <h3>Copy Formats to Master</h3>
          <ul>
            <li><strong>Email subject lines:</strong> Curiosity + relevance. Example: "The £10k mistake 80% of founders make."</li>
            <li><strong>Ad headlines:</strong> Benefit + urgency. Example: "Cut meeting time in half—today."</li>
            <li><strong>Social hooks:</strong> Contrarian or relatable. Example: "I spent 10 years learning this. Here it is in 5 minutes."</li>
            <li><strong>Video scripts:</strong> Hook → Problem → Solution → Proof → CTA.</li>
          </ul>

          <h3>Real Example: Nike's "Just Do It" Principle</h3>
          <p>Nike's famous slogan works because it removes friction. It does not describe the shoe; it commands action. When writing CTAs, use verbs that propel: "Start your free trial" beats "Free trial available" because it implies motion.</p>

          <h3>Step-by-Step: Drafting a Landing Page</h3>
          <ol>
            <li>Write a brief in your PKM. Include: target audience, objective, key benefits, and 3 customer testimonials.</li>
            <li>Prompt your Avatar: "Write a landing page using the COPY framework. Target: [audience]. Objective: [action]. Promise: [transformation]. Include testimonials."</li>
            <li>Review the draft. Highlight what works and what feels generic.</li>
            <li>Prompt for revision: "Make the headline more urgent. Add a specific number. Replace 'amazing' with concrete language."</li>
            <li>Generate 3 headline variants. Use an A/B testing tool or ask your Avatar to predict which will win based on sentiment analysis.</li>
            <li>Write the CTA (Call to Action). Rule: one primary CTA per section. Never compete for attention.</li>
            <li>Final check: Read the copy aloud. If it sounds robotic, prompt: "Make this conversational, as if explaining to a friend over coffee."</li>
          </ol>

          <h3>Framework: AIDA in Action</h3>
          <p><strong>Attention:</strong> "Your competitors just got an unfair advantage."<br>
          <strong>Interest:</strong> "AI agents can now handle 80% of customer support without human intervention."<br>
          <strong>Desire:</strong> "Imagine cutting support costs in half while improving response time to under 30 seconds."<br>
          <strong>Action:</strong> "Book a 15-minute demo and see it in action."</p>`,
          flashcards: [
            { q: "What does the 'C' in the COPY framework stand for?", a: "Context — Who is the reader? What do they know and feel?" },
            { q: "In the PAS framework, what does 'A' stand for?", a: "Agitate — Make the pain point feel urgent and visceral." },
            { q: "What was Apple's iPod tagline using the COPY framework?", a: "'1,000 songs in your pocket' — leading with the user's benefit, not the tech specs." },
            { q: "Why did Basecamp's 'calm your work down' headline outperform the feature-focused version?", a: "It led with the customer's pain (chaos) and promised transformation (calm), increasing sign-ups by 14%." },
            { q: "What is the AIDA framework sequence?", a: "Attention → Interest → Desire → Action" },
            { q: "Why does 'Start your free trial' outperform 'Free trial available' as a CTA?", a: "Verbs that imply motion and action convert better than passive descriptions." }
          ]
        },
        {
          title: "Lead Scoring & Qualification",
          content: `<h3>Focus on the Right Prospects</h3>
          <p>Not all leads are equal. Lead scoring helps your sales team prioritise the ones most likely to convert. Without it, reps waste time on tire-kickers while hot leads go cold.</p>

          <h3>Building a Lead Scoring Model</h3>
          <ol>
            <li><strong>Define your ideal customer profile (ICP).</strong> List firmographic criteria: company size, industry, location, and revenue.</li>
            <li><strong>Identify behavioural signals.</strong> Which actions indicate buying intent? Examples: visited pricing page, downloaded whitepaper, attended webinar, opened 3+ emails.</li>
            <li><strong>Assign point values.</strong>
              <ul>
                <li>Demographic fit: +10 to +30 points per criterion matched.</li>
                <li>High-intent behaviour: +20 to +50 points.</li>
                <li>Low-intent behaviour: +1 to +5 points.</li>
                <li>Negative signals: -10 to -30 points (unsubscribed, competitor domain, bounced email).</li>
              </ul>
            </li>
            <li>Set <strong>score thresholds</strong>:
              <ul>
                <li>0–30: Cold lead → nurture with content.</li>
                <li>31–60: Warm lead → sales outreach.</li>
                <li>61–100: Hot lead → immediate call.</li>
              </ul>
            </li>
          </ol>

          <h3>Framework: BANT Qualification</h3>
          <p>Before scoring, qualify with BANT:</p>
          <ul>
            <li><strong>Budget:</strong> Can they afford your solution? Ask: "What budget have you allocated for this?"</li>
            <li><strong>Authority:</strong> Can they make the purchase decision? Ask: "Who else needs to sign off on this?"</li>
            <li><strong>Need:</strong> Do they have a problem you solve? Ask: "What happens if this problem isn't solved in 6 months?"</li>
            <li><strong>Timeline:</strong> When do they need a solution? Ask: "What is your target go-live date?"</li>
          </ul>
          <p>A lead without Budget or Authority is not ready for sales, no matter how high their score.</p>

          <h3>Case Study: How Salesforce Prioritises Enterprise Leads</h3>
          <p>Salesforce uses a predictive lead scoring model that analyses 100+ data points, including firmographic fit, web behaviour, and email engagement. Their model found that leads who visit the pricing page <em>and</em> view the implementation guide convert at 4x the baseline. They now trigger immediate SDR outreach when both behaviours occur within 48 hours.</p>

          <h3>Real Example: SaaS Company Scoring Rubric</h3>
          <p>A mid-size B2B SaaS company assigns points as follows:</p>
          <ul>
            <li>Company size 500+: +25 points</li>
            <li>Visited pricing page: +30 points</li>
            <li>Downloaded case study: +20 points</li>
            <li>Email opened (each): +2 points</li>
            <li>Unsubscribed: -50 points</li>
            <li>Competitor email domain: -30 points</li>
          </ul>
          <p>They route leads scoring 70+ to senior AE's within 15 minutes. Response time improved from 4 hours to 12 minutes, and conversion rate increased 22%.</p>

          <h3>Step-by-Step: Automating Lead Scoring</h3>
          <ol>
            <li>Create a <strong>Lead Scoring Agent</strong> in Agent Studio.</li>
            <li>Connect your CRM (HubSpot, Salesforce, or Pipedrive).</li>
            <li>Upload your scoring rubric to PKM as "Lead-Scoring-Rubric.md."</li>
            <li>Configure the agent to:
              <ul>
                <li>Read new leads from CRM every hour.</li>
                <li>Score each lead against the rubric.</li>
                <li>Update the CRM score field.</li>
                <li>Trigger alerts for hot leads (&gt;60 points).</li>
              </ul>
            </li>
            <li>Test with 10 recent leads. Compare AI scores to your manual judgement. Adjust the rubric if they diverge.</li>
            <li>Enable auto-routing: Hot leads go to senior reps; warm leads to junior reps; cold leads to nurture sequences.</li>
          </ol>

          <h3>Case Study: Marketo's Lead Scoring Evolution</h3>
          <p>Marketing automation pioneer Marketo discovered that their original scoring model overvalued email opens (+5 points each). A lead could reach "hot" status just by opening emails without ever visiting the website. They adjusted to weight website behaviour 3x higher than email engagement. MQL-to-SQL conversion improved from 12% to 28%.</p>`,
          quiz: [
            { q: "In BANT qualification, what does the 'N' stand for?", options: ["Network", "Need", "Negotiation", "Number of users"], correct: 1 },
            { q: "What behaviour combination did Salesforce find converts at 4x baseline?", options: ["Email open + social click", "Pricing page visit + implementation guide view", "Webinar attendance + blog read", "Ad click + landing page visit"], correct: 1 },
            { q: "What score range indicates a hot lead in the standard model?", options: ["0–30", "31–60", "61–100", "100+"], correct: 2 },
            { q: "Why did Marketo reduce the weight of email opens in their scoring model?", options: ["Opens are too easy to fake", "Leads reached 'hot' without website engagement", "Email platforms stopped tracking opens", "It was technically difficult to measure"], correct: 1 },
            { q: "What is the minimum score threshold for warm leads?", options: ["10", "20", "31", "50"], correct: 2 }
          ],
          passThreshold: 80
        },
        {
          title: "Content Cascade Strategy",
          content: `<h3>One Idea, Ten Pieces of Content</h3>
          <p>Content marketing is a volume game. The Content Cascade turns one core idea into a week of assets. Top creators do not start from scratch every day—they extract, repackage, and redistribute.</p>

          <h3>The Cascade Model</h3>
          <ol>
            <li><strong>Pillar Content:</strong> One long-form piece (blog post, whitepaper, or video) that covers a topic exhaustively.</li>
            <li><strong>Secondary Content:</strong> 3–5 pieces derived from the pillar. Examples: LinkedIn carousel, Twitter thread, infographic, podcast episode.</li>
            <li><strong>Micro Content:</strong> 5–10 short posts, quotes, or clips extracted from secondary content.</li>
            <li><strong>Engagement Content:</strong> Polls, questions, and reactions that reference the core idea without repeating it.</li>
          </ol>

          <h3>Real Example: Gary Vaynerchuk's Content Machine</h3>
          <p>Gary Vee produces 80+ pieces of content per day from a single " DailyVee" video. The process: film a 15-minute keynote → extract 10 quotes for Twitter → turn 3 stories into Instagram carousels → clip 5 moments for TikTok → transcribe for a blog post → pull audio for a podcast. One idea. Eighty assets.</p>

          <h3>Case Study: How Semrush Built a Content Empire</h3>
          <p>SEO tool Semrush publishes 4–5 pillar guides per month, each 5,000+ words. From each guide, they produce: a webinar, a checklist PDF, 3 blog spin-offs, 10 social posts, and an email course. Their blog drives 2.5 million monthly visits—70% from content cascaded over years.</p>

          <h3>Framework: The Content Pyramid</h3>
          <p>Visualise your cascade as a pyramid:</p>
          <ul>
            <li><strong>Base (1 piece):</strong> Pillar content — 2,000+ words or 10+ minute video. High production, evergreen.</li>
            <li><strong>Middle (3–5 pieces):</strong> Secondary — Medium-form adaptations for different platforms.</li>
            <li><strong>Top (10+ pieces):</strong> Micro — Quick posts, quotes, clips. Low production, high frequency.</li>
          </ul>
          <p>Rule: never create micro content without a pillar beneath it. Standalone micro content is disposable. Cascaded micro content is strategic.</p>

          <h3>Real Example: The "10x Content" Approach</h3>
          <p>Rand Fishkin (SparkToro) coined "10x content"—content 10x better than anything ranking for your target keyword. A 10x pillar might take 40 hours to produce, but it ranks for years and fuels cascades indefinitely. Moz's "Beginner's Guide to SEO" has been updated since 2015 and still drives 100,000+ monthly visits.</p>

          <h3>Step-by-Step: Running a Content Cascade</h3>
          <ol>
            <li>Pick a topic your audience cares about. Example: "How AI reduces onboarding time by 50%."</li>
            <li>Write the pillar content. Target 2,000+ words or a 10-minute video. Include data, examples, and a clear framework.</li>
            <li>Upload the pillar to your PKM. Ask your Avatar: "Extract 5 key insights, 3 quotes, and 2 statistics from this document."</li>
            <li>Prompt for secondary content:
              <ul>
                <li>"Turn insight 1 into a 10-slide LinkedIn carousel."</li>
                <li>"Turn insight 2 into a 280-character Twitter thread (5 tweets)."</li>
                <li>"Turn statistic 1 into an infographic script with visual descriptions."</li>
              </ul>
            </li>
            <li>Prompt for micro content:
              <ul>
                <li>"Write 5 Instagram captions using the quotes."</li>
                <li>"Create 3 short-form video scripts (30–60 seconds) from the statistics."</li>
              </ul>
            </li>
            <li>Schedule everything in your content calendar. Space posts across the week to maximise reach.</li>
            <li>Track performance per format. Double down on what works. Archive what does not.</li>
          </ol>

          <h3>Case Study: Repurposing Old Content at Buffer</h3>
          <p>Social media tool Buffer audits their top-performing posts every 90 days. A blog post from 2021 about "Instagram algorithm changes" was updated with 2024 data, turned into a Twitter thread, a LinkedIn document, and a YouTube Short. The refreshed content drove 3x more traffic than the original in its first month.</p>

          <p><strong>Pro Tip:</strong> Repurpose content quarterly. A blog post from January can become a refreshed thread in April and a case study in July.</p>`,
          interaction: {
            type: "checkbox",
            instruction: "You have just published a 3,000-word pillar post: 'The Complete Guide to AI Customer Support.' Select ALL the content pieces you could create from this using the Content Cascade strategy:",
            options: [
              "A 10-slide LinkedIn carousel summarising key stats",
              "A 5-tweet Twitter thread pulling the top insights",
              "A single tweet saying 'New blog post is live!'",
              "A 30-second TikTok video demonstrating one tip",
              "An email course breaking the guide into 5 lessons",
              "A YouTube Short with the blog post URL in bio",
              "A downloadable checklist PDF of implementation steps",
              "A podcast episode interviewing a customer mentioned in the guide"
            ]
          }
        },
        {
          title: "Sales Funnel Optimisation",
          content: `<h3>Converting Visitors into Customers</h3>
          <p>A sales funnel is a journey. Your job is to remove friction at every step. Most businesses do not have a traffic problem—they have a conversion problem. Your Avatar diagnoses and fixes leaks.</p>

          <h3>The Standard Funnel Stages</h3>
          <ol>
            <li><strong>Awareness:</strong> Strangers discover you. Channels: SEO, social, ads, PR.</li>
            <li><strong>Interest:</strong> They engage with content. Metrics: time on site, pages per session, email open rate.</li>
            <li><strong>Consideration:</strong> They evaluate your solution. Metrics: pricing page views, demo requests, comparison downloads.</li>
            <li><strong>Intent:</strong> They show buying signals. Metrics: cart additions, proposal downloads, sales calls booked.</li>
            <li><strong>Purchase:</strong> They convert. Metrics: conversion rate, average order value, time to close.</li>
            <li><strong>Retention:</strong> They stay and expand. Metrics: churn rate, net revenue retention, upsell rate.</li>
          </ol>

          <h3>Framework: The AARRR Pirate Metrics</h3>
          <p>Dave McClure's framework for startup funnel health:</p>
          <ul>
            <li><strong>Acquisition:</strong> Users come to your site from channels.</li>
            <li><strong>Activation:</strong> Users have a great first experience (the "aha" moment).</li>
            <li><strong>Retention:</strong> Users come back within a defined period.</li>
            <li><strong>Revenue:</strong> Users perform a paying action.</li>
            <li><strong>Referral:</strong> Users invite others.</li>
          </ul>
          <p>Most startups obsess over Acquisition but ignore Activation. A user who visits but never experiences value is a wasted acquisition. Fix Activation first.</p>

          <h3>Case Study: Dropbox's Viral Loop</h3>
          <p>Dropbox had a funnel leak at the Acquisition stage—they were paying $300+ per customer via Google Ads. Instead, they built a referral program: invite a friend, get 500MB free. Activation became Acquisition. Their viral coefficient exceeded 1.0, meaning every user brought in more than one new user. Customer acquisition cost dropped to near zero.</p>

          <h3>Real Example: Airbnb's Professional Photography Program</h3>
          <p>Airbnb noticed their Consideration-to-Intent conversion was low. Users browsed listings but did not book. The friction? Poor-quality photos. Airbnb offered free professional photography to hosts. Listings with pro photos booked 2–3x more frequently. A single friction fix at one stage transformed the entire funnel.</p>

          <h3>Framework: The Funnel Math Formula</h3>
          <p>If you get 10,000 visitors/month with a 2% conversion rate, you have 200 customers. To double customers, you can either:</p>
          <ul>
            <li>Double traffic to 20,000 (expensive)</li>
            <li>Double conversion to 4% (often cheaper)</li>
            <li>Improve both by 41% (compound effect)</li>
          </ul>
          <p>Funnel optimisation focuses on the cheapest lever: conversion rate.</p>

          <h3>Step-by-Step: Funnel Audit</h3>
          <ol>
            <li>Export funnel data for the last 90 days. Include stage volumes and conversion rates between stages.</li>
            <li>Upload the data to PKM. Ask your Avatar: "Identify the biggest drop-off stage and suggest 3 hypotheses for why."</li>
            <li>For each hypothesis, design a test:
              <ul>
                <li>Hypothesis: Pricing is unclear → Test: Add a pricing calculator to the page.</li>
                <li>Hypothesis: Demo booking is too hard → Test: Add Calendly embed and reduce form fields.</li>
                <li>Hypothesis: Follow-up is too slow → Test: Auto-send a personalised video within 1 hour.</li>
              </ul>
            </li>
            <li>Run one test for 2 weeks. Measure change in conversion rate.</li>
            <li>Document results in PKM. Build a "Funnel Experiments" library.</li>
            <li>Repeat monthly. Compound improvements yield exponential growth.</li>
          </ol>

          <h3>Case Study: Slack's Bottom-Up Funnel</h3>
          <p>Slack's funnel inverted the traditional model. Instead of selling to executives top-down, they made Slack free for small teams. Individual users (Activation) became evangelists who brought Slack into their companies (Acquisition → Revenue). By the time the enterprise deal was signed, 50+ employees were already daily active users. Their "land and expand" strategy turned the funnel into a network effect.</p>`,
          quiz: [
            { q: "In the AARRR framework, what does the first 'A' stand for?", options: ["Activation", "Acquisition", "Attention", "Awareness"], correct: 1 },
            { q: "What was Dropbox's solution to their $300/customer acquisition cost?", options: ["SEO optimisation", "A referral program with free storage", "Paid social ads", "Influencer marketing"], correct: 1 },
            { q: "What friction did Airbnb identify in their Consideration-to-Intent stage?", options: ["High prices", "Poor-quality photos", "Slow website", "Lack of reviews"], correct: 1 },
            { q: "According to the Funnel Math Formula, which is typically the cheapest lever to double customers?", options: ["Doubling traffic", "Doubling conversion rate", "Cutting prices", "Adding more products"], correct: 1 },
            { q: "What is Slack's 'land and expand' strategy?", options: ["Free for individuals, then expand to enterprise", "Buy competitors", "Focus on enterprise first", "Charge per feature"], correct: 0 }
          ],
          passThreshold: 80
        },
        {
          title: "Email Marketing Automation",
          content: `<h3>Sequences That Sell While You Sleep</h3>
          <p>Email is still the highest-ROI marketing channel—$42 returned for every $1 spent (DMA, 2019). Automation makes it scale without losing personality. The key is relevance: the right message, to the right person, at the right time.</p>

          <h3>Core Email Sequences</h3>
          <ol>
            <li><strong>Welcome Sequence:</strong> 5–7 emails over 10 days. Introduce your brand, share your best content, and make a low-friction offer.</li>
            <li><strong>Nurture Sequence:</strong> Weekly emails for 8 weeks. Educate, entertain, and build trust. No hard selling.</li>
            <li><strong>Conversion Sequence:</strong> 3–5 emails over 5 days. Address objections, share case studies, and present a deadline.</li>
            <li><strong>Re-engagement Sequence:</strong> 3 emails over 7 days for inactive subscribers. "We miss you" → "Here is what you missed" → "Last chance."</li>
            <li><strong>Post-Purchase Sequence:</strong> Onboarding tips, upsell offers, and review requests.</li>
          </ol>

          <h3>Real Example: Airbnb's Welcome Sequence</h3>
          <p>Airbnb's first email after sign-up is a masterpiece of personalisation. It does not say "Welcome to Airbnb." It says: "[First name], here are 3 homes in [City] you might love." They trigger action immediately by showing relevant listings based on the user's search behaviour. Their welcome sequence has a 70%+ open rate because every email is context-aware.</p>

          <h3>Framework: The Email Value Ladder</h3>
          <p>Structure your sequences by value delivered, not by what you want to sell:</p>

            <li><strong>Decoy Effect:</strong> Add a third option that makes the middle option look best. The Economist's famous "web $59, print $125, both $125" experiment increased sales of the bundle by 43%.</li>
            <li><strong>Bundling:</strong> Combine products so customers cannot compare line-by-line. SaaS companies bundle support, storage, and features.</li>
